services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: screener-clickhouse
    restart: unless-stopped
    ports:
      - "9000:9000"   # native protocol (Go driver DSN)
      - "8123:8123"   # HTTP: curl 'localhost:8123/?query=SELECT+1'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-screener}
      CLICKHOUSE_DB: screener
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  screener:
    build: .
    image: screener:local
    container_name: screener
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      ADDR: ":8090"
      LOG: info
      CLICKHOUSE: clickhouse://default:${CLICKHOUSE_PASSWORD:-screener}@clickhouse:9000/screener
      CH_TTL_DAYS: "180"
    healthcheck:
      disable: true

volumes:
  clickhouse-data:
