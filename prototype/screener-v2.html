<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screener</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Terminal kit: tokens and components copied from screener-v1.html */
:root {
  --font: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
  /* terminal-front _theme.scss, light */
  --white: #ffffff; --black: #141414;
  --neutral-800: #1c2026; --neutral-700: #6e6e72; --neutral-600: #7f7f83; --neutral-500: #8e8e93;
  --neutral-400: #ababae; --neutral-300: #c3c3c5; --neutral-200: #d9d9da; --neutral-100: #ededed;
  --neutral-50: #f6f6f6; --neutral-25: #fafafa;
  --blue-500: #007aff; --blue-400: #729eff; --blue-300: #a1bbff; --blue-800: #004da1;
  --green-500: #56b683; --green-700: #438d65; --green-800: #367353; --green-300: #aed6bf;
  --red-500: #f18169; --red-700: #bb6451; --red-800: #985242; --red-300: #f7beb5;
  --orange-500: #ff6f00; --orange-400: #ffa432; --yellow-500: #ffcc00;

  --terminal-v2-text: #202326; --terminal-v2-muted: #60676a;
  --dropdown-background: #ffffff;
  --dropdown-hover: color-mix(in srgb, var(--terminal-v2-text) 5%, var(--dropdown-background));
  --dropdown-border: color-mix(in srgb, var(--terminal-v2-text) 10%, transparent);
  --dropdown-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  --table-pin-shadow: rgb(0 0 0 / 25%);
  --primary-accent: var(--blue-500); --primary-deep: var(--blue-800);
  --control-focus-border: color-mix(in srgb, var(--primary-deep) 45%, var(--terminal-v2-muted));
  --text-high-emphasis: var(--neutral-800); --text-mid-emphasis: var(--neutral-500); --text-low-emphasis: var(--neutral-400);
  --text-light: var(--white); --text-success-accent: var(--green-500); --text-error-accent: var(--red-500);
  --text-warning-accent: var(--orange-500); --text-attention-accent: var(--yellow-500);
  --icons-mid-emphasis: var(--neutral-500); --icons-low-emphasis: var(--neutral-300);
  --card-background: var(--white); --dark-background: var(--neutral-800); --app-background: var(--neutral-25);
  --card-primary-background-light: #e4ebff; --card-neutral-background: var(--neutral-100);
  --card-success-background-light: #e7f2eb; --card-error-background-light: #fcebe9;
  --border: var(--neutral-100); --border-secondary: transparent; --background-secondary: transparent;
  --long: var(--green-500); --short: var(--red-500);
  --widget-background: var(--white); --widget-header-background: var(--neutral-25);
  --link-group-orange: var(--orange-500);
  --depth-bid-fill: rgba(86, 182, 131, 0.16); --depth-ask-fill: rgba(241, 129, 105, 0.16);
  --cell-border: var(--border);
  --shadow-elevate: 0 0 0 1px rgba(0,0,0,.06), 0 6px 6px -3px rgba(0,0,0,.06), 0 24px 24px -12px rgba(0,0,0,.04), 0 24px 24px 2px rgba(0,0,0,.1);
  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-24: 24px; --space-32: 32px;
  --radius-4: 4px; --radius-6: 6px; --radius-8: 8px;
  --duration-fast: 120ms; --duration-base: 200ms; --duration-slow: 320ms; --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --row-h: 38px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --terminal-v2-text: var(--neutral-50); --terminal-v2-muted: var(--neutral-500);
  --dropdown-background: #1a1a1c; --dropdown-shadow: 0 8px 24px rgba(0,0,0,.32);
  --primary-deep: var(--blue-300);
  --text-high-emphasis: var(--neutral-50); --text-mid-emphasis: var(--neutral-500); --text-low-emphasis: var(--neutral-700);
  --icons-mid-emphasis: var(--neutral-500); --icons-low-emphasis: var(--neutral-700);
  --card-background: #101011; --app-background: #090909;
  --card-primary-background-light: #007aff26; --card-neutral-background: #1c1c1e;
  --card-success-background-light: #56b68326; --card-error-background-light: #f1816926;
  --border: #292929; --border-secondary: #3e3e3e; --background-secondary: #292929;
  --widget-background: #101011; --widget-header-background: #161617;
  --link-group-orange: var(--orange-400);
  --depth-bid-fill: rgba(86,182,131,.22); --depth-ask-fill: rgba(241,129,105,.22);
  --cell-border: var(--border);
  --shadow-elevate: 0 0 0 1px rgba(255,255,255,.08), 0 6px 6px -3px rgba(0,0,0,.4), 0 24px 24px -12px rgba(0,0,0,.32), 0 24px 24px 2px rgba(0,0,0,.4);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --terminal-v2-text: var(--neutral-50); --terminal-v2-muted: var(--neutral-500);
  --dropdown-background: #1a1a1c; --dropdown-shadow: 0 8px 24px rgba(0,0,0,.32);
  --primary-deep: var(--blue-300);
  --text-high-emphasis: var(--neutral-50); --text-mid-emphasis: var(--neutral-500); --text-low-emphasis: var(--neutral-700);
  --icons-mid-emphasis: var(--neutral-500); --icons-low-emphasis: var(--neutral-700);
  --card-background: #101011; --app-background: #090909;
  --card-primary-background-light: #007aff26; --card-neutral-background: #1c1c1e;
  --card-success-background-light: #56b68326; --card-error-background-light: #f1816926;
  --border: #292929; --border-secondary: #3e3e3e; --background-secondary: #292929;
  --widget-background: #101011; --widget-header-background: #161617;
  --link-group-orange: var(--orange-400);
  --depth-bid-fill: rgba(86,182,131,.22); --depth-ask-fill: rgba(241,129,105,.22);
  --cell-border: var(--border);
  --shadow-elevate: 0 0 0 1px rgba(255,255,255,.08), 0 6px 6px -3px rgba(0,0,0,.4), 0 24px 24px -12px rgba(0,0,0,.32), 0 24px 24px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--app-background); color: var(--text-high-emphasis);
  font-family: var(--font); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; letter-spacing: normal; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--control-focus-border); outline-offset: -1px; }
svg { display: block; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* Prototype bar: not part of the terminal, just the lab controls */
.lab { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; color: var(--text-mid-emphasis); }
.lab__title { color: var(--text-high-emphasis); font-weight: 500; }
.lab__spacer { flex: 1; }
.lab__badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-background); }
.lab__badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--long); }
.lab__badge.-demo i { background: var(--orange-500); }
.lab__badge.-loading i { background: var(--text-low-emphasis); animation: breathe 1s infinite alternate; }
@keyframes breathe { to { opacity: .3; } }

/* Buttons from the kit: -sm secondary, -no-border */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-background); color: var(--text-high-emphasis); font-weight: 500; white-space: nowrap; transition: background-color .1s ease-out; }
.btn:hover { background: var(--card-neutral-background); }
.btn.-ghost { border-color: transparent; background: transparent; color: var(--text-mid-emphasis); }
.btn.-ghost:hover { color: var(--text-high-emphasis); background: var(--dropdown-hover); }
.btn.-icon { width: 28px; padding: 0; }
.btn[aria-expanded="true"], .btn.-on { background: var(--card-neutral-background); color: var(--text-high-emphasis); }
.btn svg { width: 14px; height: 14px; }
.btn .count { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--primary-accent); color: var(--text-light); font-size: 10px; line-height: 16px; text-align: center; }
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { border-color: var(--border-secondary); }
:root[data-theme="light"] .btn { border-color: var(--border); }

/* Widget frame */
.widget-frame { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--widget-background); }
.widget-frame__header { display: flex; align-items: center; gap: 6px; height: 32px; flex: none; padding: 0 6px; border-bottom: 1px solid var(--border); background: var(--widget-header-background); user-select: none; }
.widget-frame__grip { color: var(--icons-low-emphasis); }
.widget-frame__grip svg { width: 12px; height: 12px; }
.widget-frame__title { color: var(--text-mid-emphasis); }
.header-symbol { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; color: var(--text-high-emphasis); font-weight: 600; }
.header-symbol:hover { background: var(--dropdown-hover); }
.header-symbol i { width: 8px; height: 8px; border-radius: 50%; background: var(--link-group-orange); }
.header-symbol small { font-weight: 400; color: var(--text-mid-emphasis); }
.widget-frame__actions { margin-left: auto; display: flex; gap: 2px; }
.widget-frame__actions .btn { height: 24px; width: 24px; }

/* Toolbar (positions__toolbar) */
.scr__toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; flex: none; padding: 4px 8px; border-bottom: 1px solid var(--border); }
.scr__tabs { display: flex; gap: 4px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.scr__tabs::-webkit-scrollbar { display: none; }
.tab { height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text-mid-emphasis); white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 400; }
.tab:hover { color: var(--text-high-emphasis); }
.tab[aria-pressed="true"] { background: var(--card-neutral-background); color: var(--text-high-emphasis); font-weight: 500; }
.tab svg { width: 12px; height: 12px; }
.tab .n { color: var(--text-low-emphasis); font-weight: 400; }
.scr__actions { display: flex; align-items: center; gap: 8px; flex: none; }

/* Search input (kit input -sm) */
.search { position: relative; }
.search input { height: 28px; width: 180px; max-width: 40vw; padding: 0 8px 0 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-background); color: var(--text-high-emphasis); }
.search input::placeholder { color: var(--text-mid-emphasis); }
.search input:hover { border-color: var(--primary-accent); }
.search svg { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; color: var(--icons-mid-emphasis); pointer-events: none; }
:root[data-theme="dark"] .search input, :root:not([data-theme="light"]) .search input { border-color: var(--border-secondary); }
:root[data-theme="light"] .search input { border-color: var(--border); }

/* Segmented period switch (dropdown-trigger look) */
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--card-neutral-background); }
.seg button { height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text-mid-emphasis); }
.seg button[aria-pressed="true"] { background: var(--widget-background); color: var(--text-high-emphasis); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* Filter strip */
.scr__filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: none; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--widget-header-background); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-background); color: var(--text-mid-emphasis); font-weight: 500; white-space: nowrap; }
.chip b { color: var(--text-high-emphasis); font-weight: 500; }
.chip button { display: inline-flex; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--icons-mid-emphasis); align-items: center; justify-content: center; }
.chip button:hover { color: var(--text-error-accent); }
.chip button svg { width: 12px; height: 12px; }
:root[data-theme="dark"] .chip, :root:not([data-theme="light"]) .chip { border-color: var(--border-secondary); background: var(--background-secondary); }
:root[data-theme="light"] .chip { border-color: var(--border); background: var(--card-background); }
.scr__filters .muted { color: var(--text-mid-emphasis); }

/* Table (widget-table + DataTable -sm) */
.scr__body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.trading-table { flex: 1; min-height: 0; overflow: auto; margin-right: 2px; scrollbar-gutter: stable; scrollbar-color: var(--border) var(--widget-background); }
.trading-table table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
.trading-table th, .trading-table td { padding: 0 8px; vertical-align: middle; white-space: nowrap; }
.trading-table th { position: sticky; top: 0; z-index: 10; height: 32px; background: var(--widget-header-background); color: var(--text-mid-emphasis); font-weight: 400; text-align: left; user-select: none; cursor: pointer; }
.trading-table th.-end, .trading-table td.-end { text-align: right; }.trading-table th.-end { padding-left: 22px; }
.trading-table th .lbl { position: relative; display: inline-block; }
.trading-table th .srt { position: absolute; left: calc(100% + 2px); top: 1px; opacity: 0; width: 12px; height: 12px; }
.trading-table th.-end .srt { left: auto; right: calc(100% + 2px); }
.trading-table th:hover .srt, .trading-table th[aria-sort] .srt { opacity: 1; }
.trading-table th[aria-sort] { color: var(--text-high-emphasis); }
/* Mark price: running figure from the terminal control bar (AnimatedNumber.vue), tone="none":
   the digits tween to the new value and the tick takes the side's colour at once, then the
   figure fades back to the text colour. No resting colour: 517 rows would paint the whole column. */
.mark-cell { display: inline-block; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mark-cell.-flash-up { animation: animated-number-flash-up var(--duration-base) var(--ease-standard); }
.mark-cell.-flash-down { animation: animated-number-flash-down var(--duration-base) var(--ease-standard); }
@keyframes animated-number-flash-up { from { color: var(--long); } }
@keyframes animated-number-flash-down { from { color: var(--short); } }
.level { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.level__px { color: var(--text-high-emphasis); }
.trading-table td { height: var(--row-h); overflow: hidden; text-overflow: ellipsis; }
.trading-table tr:hover td { background: var(--card-neutral-background); }
.trading-table tr[aria-selected="true"] td { background: var(--card-primary-background-light); }
.trading-table tr { cursor: pointer; }
.trading-table td[data-pin], .trading-table th[data-pin] { position: sticky; background: var(--widget-background); }
.trading-table th[data-pin] { background: var(--widget-header-background); z-index: 11; }
.trading-table td[data-pin="left"], .trading-table th[data-pin="left"] { left: 0; }
.trading-table td[data-pin="right"], .trading-table th[data-pin="right"] { right: 0; }
.trading-table tr:hover td[data-pin] { background: var(--card-neutral-background); }
.trading-table tr[aria-selected="true"] td[data-pin] { background: color-mix(in srgb, var(--primary-accent) 15%, var(--widget-background)); }
.trading-table.-scrolled td[data-pin="left"], .trading-table.-scrolled th[data-pin="left"] { box-shadow: 4px 0 6px -4px var(--table-pin-shadow); }
.pos { color: var(--long); } .neg { color: var(--short); } .dim { color: var(--text-low-emphasis); } .mid { color: var(--text-mid-emphasis); }
.na { color: var(--text-low-emphasis); }

.instrument-cell { display: flex; align-items: center; gap: 8px; }
.star { display: inline-flex; width: 16px; height: 16px; padding: 0; border: 0; background: transparent; color: var(--icons-low-emphasis); opacity: 0; align-items: center; justify-content: center; flex: none; }
.star svg { width: 12px; height: 12px; }
tr:hover .star, .star.-on { opacity: 1; }
.star.-on { color: var(--text-attention-accent); }
.star:hover { color: var(--text-high-emphasis); }
.instrument-cell__base { color: var(--text-high-emphasis); font-weight: 600; }
.instrument-cell__rest { font-size: 10px; line-height: 12px; color: var(--text-low-emphasis); }
.instrument-cell__text { display: flex; flex-direction: column; line-height: 1.2; }
.spark { width: 72px; height: 22px; }
.bar { display: inline-flex; align-items: center; gap: 6px; }
.bar i { display: inline-block; width: 40px; height: 4px; border-radius: 2px; background: var(--card-neutral-background); position: relative; overflow: hidden; }
.bar i b { position: absolute; top: 0; bottom: 0; left: 0; background: var(--long); border-radius: 2px; }
.bar i b.-short { background: var(--short); }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 6px; font-size: 10px; line-height: 12px; font-weight: 500; }
.badge.-sq { background: var(--card-primary-background-light); color: var(--primary-accent); }
.badge.-ex { background: var(--card-error-background-light); color: var(--text-error-accent); }
.row-menu-btn { opacity: 0; }
tr:hover .row-menu-btn, .row-menu-btn[aria-expanded="true"] { opacity: 1; }
.empty { padding: 24px; color: var(--text-mid-emphasis); text-align: center; }
.skeleton { display: inline-block; width: 48px; height: 10px; border-radius: 4px; background: var(--card-neutral-background); animation: breathe 1s infinite alternate; }

/* Status bar */
.scr__status { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; flex: none; padding: 6px 8px; border-top: 1px solid var(--border); color: var(--text-mid-emphasis); background: var(--widget-header-background); }
.scr__status b { color: var(--text-high-emphasis); font-weight: 500; }
.scr__status .spacer { flex: 1; }

/* Popovers (dropdown-surface + dropdown-row) */
.pop { position: fixed; z-index: 100; min-width: 200px; padding: 4px; border-radius: 8px; background: var(--dropdown-background); color: var(--terminal-v2-text); box-shadow: var(--dropdown-shadow); }
.pop[hidden] { display: none; }
.pop__row { display: flex; align-items: center; gap: 8px; min-height: 32px; width: 100%; padding: 8px; border: 0; border-radius: 4px; background: transparent; color: var(--terminal-v2-text); text-align: left; }
.pop__row:hover { background: var(--dropdown-hover); }
.pop__row[aria-checked="true"] { font-weight: 500; }
.pop__row .box { display: grid; place-items: center; width: 16px; height: 16px; flex: none; border: 1px solid var(--dropdown-border); border-radius: 4px; }
.pop__row[aria-checked="true"] .box { border-color: transparent; }
.pop__row .box svg { width: 12px; height: 12px; }
.pop__row .hint { margin-left: auto; color: var(--terminal-v2-muted); font-size: 10px; }
.pop__row.-danger { color: var(--text-error-accent); }
.pop__group { padding: 10px 8px 4px; color: var(--terminal-v2-muted); font-size: 10px; line-height: 12px; letter-spacing: .4px; text-transform: uppercase; }
.pop__sep { height: 1px; margin: 4px 0; background: var(--dropdown-border); }
.pop__cols { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 0 8px; max-height: 60vh; overflow: auto; }
.pop__wrap { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 0 8px; }
.sector { white-space: nowrap; }
.pop__form { display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; align-items: center; }
.pop__form select, .pop__form input { height: 28px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--dropdown-border); background: var(--dropdown-hover); color: var(--terminal-v2-text); }
.pop__form input { width: 90px; }
.pop__form .btn { border-color: transparent; background: var(--primary-accent); color: var(--text-light); }
.pop__form .btn:hover { background: var(--primary-deep); }
.pop__foot { display: flex; gap: 6px; padding: 8px; justify-content: flex-end; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1500; display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--dark-background); color: var(--text-light); pointer-events: none; opacity: 0; transition: opacity .12s ease-out; }
.toast.-show { opacity: 1; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--link-group-orange); }

@media (max-width: 720px) {
  .scr__tabs { flex-basis: 100%; }
  .scr__actions { margin-left: auto; flex-wrap: wrap; }
  .pop__cols { grid-template-columns: 1fr; }
  .search input { width: 140px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== Lab additions: a clean default table and three ways to manage its columns ===== */
.lab__note { flex: none; min-height: 16px; max-width: 132ch; color: var(--text-mid-emphasis); }
.lab .btn.-ghost[aria-pressed="true"] { background: var(--card-neutral-background); color: var(--text-high-emphasis); }
.lab__lbl { color: var(--text-low-emphasis); }

.bar { position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; min-height: 40px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.bar.-sub { background: var(--widget-header-background); }
.bar__grow { flex: 1 1 0; min-width: 8px; }
.scr__tabs.-views { flex: none; }
.btn.-primary { border-color: transparent !important; background: var(--primary-accent); color: var(--text-light); }
.btn.-primary:hover { background: var(--primary-deep); }
.btn.-add { height: 24px; padding: 0 8px 0 6px; border-style: dashed; background: transparent; color: var(--text-mid-emphasis); font-weight: 400; }
.btn.-add:hover { color: var(--text-high-emphasis); }
.btn.-add svg { width: 12px; height: 12px; }
.seg button i, .opt i { margin-left: 4px; font-style: normal; font-weight: 400; color: var(--text-low-emphasis); }

/* Header: reorder by dragging (as the terminal's Positions table), a menu caret on hover, a remove cross in customize mode */
.trading-table.-reorder th[data-k]:not([data-k="symbol"]) { cursor: grab; touch-action: none; }
.trading-table th[data-dragging] { color: var(--primary-accent); cursor: grabbing; }
.trading-table th[data-drop-edge="before"] { box-shadow: inset 2px 0 var(--primary-accent); }
.trading-table th[data-drop-edge="after"] { box-shadow: inset -2px 0 var(--primary-accent); }
body.-dragging, body.-dragging * { cursor: grabbing !important; user-select: none; }
.trading-table th:hover, .trading-table th:has(.hm[aria-expanded="true"]) { z-index: 12; }
.trading-table th.-flt .lbl { color: var(--primary-accent); }
.hm, .hx { position: absolute; z-index: 1; top: 50%; right: -9px; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 20px; margin-top: -10px; padding: 0; border: 0; border-radius: 4px; background: var(--widget-header-background); color: var(--icons-mid-emphasis); opacity: 0; }
.hm svg, .hx svg { width: 12px; height: 12px; }
.trading-table th:hover .hm, .hm[aria-expanded="true"] { opacity: 1; }
.hm:hover, .hm[aria-expanded="true"] { background: var(--card-neutral-background); color: var(--text-high-emphasis); }
.trading-table th:not(.-end) .hm { position: static; margin: 0 0 0 18px; vertical-align: middle; }
.trading-table.-editing thead th[data-k] { padding-right: 26px; background: var(--card-neutral-background); }
.trading-table.-editing .hx { right: 4px; opacity: 1; background: transparent; }
.hx:hover { color: var(--text-error-accent); }
.trading-table th .grip { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; color: var(--icons-low-emphasis); }
/* a text column after a numeric one keeps its label clear of the neighbour's menu button */
.trading-table th[data-k]:not(.-end):not([data-pin]), .trading-table td:not(.-end):not([data-pin]):not(.-tail) { padding-left: 24px; }
.trading-table th.-tail, .trading-table td.-tail { width: 36px; min-width: 36px; padding: 0 4px; cursor: default; }
.addcol { width: 24px; height: 24px; }
.level { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }

/* Column catalogue: metric families with a plain description; periods are chips */
.cat { width: 380px; max-width: calc(100vw - 32px); }
.cat__search { display: block; padding: 4px 4px 0; }
.cat__search input { width: 100%; max-width: none; background: var(--dropdown-hover); border-color: transparent !important; color: var(--terminal-v2-text); }
.cat__search svg { left: 12px; top: 11px; }
.cat__list { max-height: min(60vh, 520px); overflow: auto; overscroll-behavior: contain; }
.cat__item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 6px 8px; border-radius: 6px; }
.cat__item:hover { background: var(--dropdown-hover); }
.cat__text b { display: block; font-weight: 500; color: var(--terminal-v2-text); }
.cat__text span { color: var(--terminal-v2-muted); }
.cat__keys { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; max-width: 190px; }
.ck, .opt { height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: var(--dropdown-hover); color: var(--terminal-v2-muted); white-space: nowrap; }
.cat__item:hover .ck { background: color-mix(in srgb, var(--terminal-v2-text) 9%, var(--dropdown-background)); }
.ck:hover, .opt:hover { color: var(--terminal-v2-text); }
.ck[aria-pressed="true"], .opt[aria-pressed="true"] { background: var(--card-primary-background-light) !important; color: var(--terminal-v2-text); font-weight: 500; }
.pop__row .tick { margin-left: auto; width: 12px; height: 12px; color: var(--primary-accent); }
.pop__row .tick + .hint { margin-left: 0; }
.pop__foot.-split { justify-content: space-between; align-items: center; }
.pop__foot .lbl { color: var(--terminal-v2-muted); }
.pop .seg { background: var(--dropdown-hover); }
.pop .seg button[aria-pressed="true"] { background: var(--dropdown-background); color: var(--terminal-v2-text); }

/* Filters popover: one compact row of buttons per column that is in the table */
.fr { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-items: center; padding: 8px; max-width: 520px; }
.fr__l { color: var(--terminal-v2-text); font-weight: 500; white-space: nowrap; }
.qopts { display: flex; flex-wrap: wrap; gap: 4px; }
.fin { height: 24px; padding: 0 4px; border: 1px solid transparent; border-radius: 6px; background: var(--dropdown-hover); color: var(--terminal-v2-text); }
.fin.-on { border-color: var(--primary-accent); }

/* B: columns drawer, the screener's take on the Positions column settings */
.drawer { position: absolute; z-index: 40; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; width: 340px; max-width: 100%; background: var(--dropdown-background); color: var(--terminal-v2-text); box-shadow: var(--dropdown-shadow); }
.drawer[hidden] { display: none; }
.drawer__head { display: flex; align-items: center; gap: 8px; flex: none; padding: 8px 8px 4px 12px; }
.drawer__head b { font-weight: 500; }
.drawer__head .mid { color: var(--terminal-v2-muted); }
.drawer__body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 0 4px; }
.drawer__foot { display: flex; justify-content: flex-end; flex: none; padding: 8px; }
.drawer .cat { width: auto; max-width: none; }
.drawer .cat__list { max-height: none; overflow: visible; }
.dl__row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 8px; border-radius: 4px; cursor: grab; user-select: none; touch-action: none; }
.dl__row[data-locked] { cursor: default; color: var(--terminal-v2-muted); }
.dl__row:hover { background: var(--dropdown-hover); }
.dl__row[data-dragging] { background: var(--dropdown-hover); color: var(--primary-accent); }
.dl__row[data-drop-edge="before"] { box-shadow: inset 0 2px var(--primary-accent); }
.dl__row[data-drop-edge="after"] { box-shadow: inset 0 -2px var(--primary-accent); }
.dl__grip { width: 12px; height: 12px; color: var(--icons-low-emphasis); }
.dl__x { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--icons-mid-emphasis); opacity: 0; }
.dl__row:hover .dl__x, .dl__x:focus-visible { opacity: 1; }
.dl__x:hover { color: var(--text-error-accent); }
.dl__x svg { width: 12px; height: 12px; }
@media (max-width: 720px) { .cat__keys { max-width: 150px; } }

/* ===== Lab 3: one clean table over three exchanges, three placements of the same controls ===== */
.xg { width: 12px; height: 12px; flex: none; }
.sym { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-width: 104px; }
.sym b { color: var(--text-high-emphasis); font-weight: 600; }
.venues { display: inline-flex; gap: 4px; color: var(--icons-low-emphasis); }
.vslot { display: block; width: 12px; height: 12px; }
.trading-table tr:hover .venues { color: var(--icons-mid-emphasis); }

/* A: four dropdown buttons of one kind, name then value */
.btn.-dd { gap: 6px; font-weight: 400; }
.btn.-dd .k { color: var(--text-mid-emphasis); }
.btn.-dd .v { color: var(--text-high-emphasis); font-weight: 500; }
.btn.-dd > svg { width: 12px; height: 12px; margin-left: -2px; color: var(--icons-mid-emphasis); }
.pop__row .xg { color: var(--terminal-v2-muted); }
.pop__row .box { color: var(--text-light); }
.pop__row[aria-checked="true"] .box { background: var(--primary-accent); }
.pop__row .tks { display: block; width: 12px; height: 12px; flex: none; color: var(--primary-accent); }
.pop__row .tks svg { width: 12px; height: 12px; }
.pop__row:disabled { opacity: .4; cursor: not-allowed; }
.pop__row:disabled:hover { background: transparent; }
.scr__filters .cnt { margin-left: auto; color: var(--text-mid-emphasis); }

/* Exchanges as toggles (B panel, C bar) */
.seg { flex-wrap: wrap; }
.seg.-multi button { display: inline-flex; align-items: center; gap: 6px; }
.seg.-multi button[aria-pressed="false"] { color: var(--text-low-emphasis); }

/* Columns: what is in the table (drag, remove) next to what can be added */
.cols { display: grid; grid-template-columns: 216px 380px; gap: 0 4px; align-items: start; max-width: calc(100vw - 32px); }
.cols > div { min-width: 0; }
.cols .cat { width: auto; }
.cols .pop__foot { justify-content: flex-start; padding: 8px 4px 4px; }
.btn.-ghost { border-color: transparent !important; }
.cols .dl { max-height: min(60vh, 520px); overflow: auto; overscroll-behavior: contain; }
@media (max-width: 680px) { .cols { grid-template-columns: minmax(0, 1fr); width: calc(100vw - 32px); } .cols .dl, .cols .cat__list { max-height: 32vh; } }
.dl__n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dl__row.-f { grid-template-columns: 12px minmax(0, 1fr) auto 22px; }
.dl__row.-f .dl__x { grid-column: 4; }
.dl__f { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 4px 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--terminal-v2-muted); white-space: nowrap; }
.dl__f svg { width: 12px; height: 12px; }
.dl__f:hover, .dl__f[aria-expanded="true"] { background: var(--dropdown-hover); color: var(--terminal-v2-text); }
.dl__f.-on { background: var(--card-primary-background-light); color: var(--terminal-v2-text); font-weight: 500; }
.dl__opts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 2px 8px 8px 28px; }
.dl__opts .lbl { color: var(--terminal-v2-muted); margin-left: 4px; }
.drawer { width: 372px; }
.trading-table { min-width: 0; }
@media (min-width: 900px) { .scr__body:has(> .drawer:not([hidden])) { flex-direction: row; } .scr__body > .drawer { position: static; flex: none; box-shadow: none; } }
.drawer__sec { padding: 0 8px 2px; }
.drawer .seg { background: var(--dropdown-hover); }
.drawer .seg button[aria-pressed="true"] { background: var(--dropdown-background); color: var(--terminal-v2-text); }

/* C: the condition of a column sits right under its name */
.trading-table thead tr.frow th { top: 32px; height: 28px; cursor: default; }
.fc { height: 20px; padding: 0 6px; border: 0; border-radius: 4px; background: transparent; color: var(--text-low-emphasis); white-space: nowrap; }
.fc:hover, .fc[aria-expanded="true"] { background: var(--card-neutral-background); color: var(--text-high-emphasis); }
.fc.-on { background: var(--card-primary-background-light); color: var(--text-high-emphasis); font-weight: 500; }
.fc.-clear { display: inline-flex; align-items: center; gap: 4px; }
.fc.-clear svg { width: 10px; height: 10px; }
.trading-table th.-end .fc { margin-right: -6px; }
.trading-table th:not(.-end) .fc { margin-left: -6px; }

/* ===== Prototype v2 ===== */
.sym { justify-content: flex-start; gap: 8px; min-width: 0; }
.sym b { min-width: 64px; max-width: 104px; overflow: hidden; text-overflow: ellipsis; }
/* Column widths come from layout(): the number columns share the free width equally, so a few columns fill the widget,
   more columns narrow down to their minimum, and only then the table scrolls sideways. */
.trading-table table { table-layout: fixed; min-width: 0; }
.trading-table th { overflow: hidden; text-overflow: ellipsis; }
/* what a summed figure is made of, on hover */
.tip { position: fixed; z-index: 90; display: grid; grid-template-columns: auto auto; gap: 4px 16px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--dropdown-background); color: var(--terminal-v2-muted); box-shadow: var(--dropdown-shadow); pointer-events: none; white-space: nowrap; }
.tip[hidden] { display: none; }
.tip span { display: inline-flex; align-items: center; gap: 6px; }
.tip b { color: var(--terminal-v2-text); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.tip span.-lead { color: var(--terminal-v2-text); }
.tip b.-dim { color: var(--terminal-v2-muted); font-weight: 400; }

/* A condition as a phrase on the bar: column, operator, value, remove. The gaps between the parts show the bar through, no drawn lines. */
.fp { display: inline-flex; align-items: stretch; gap: 1px; height: 28px; border-radius: 8px; overflow: hidden; flex: none; }
.fp > * { display: inline-flex; align-items: center; height: 28px; padding: 0 8px; border: 0; background: var(--card-neutral-background); color: var(--text-mid-emphasis); white-space: nowrap; }
.fp__n { color: var(--text-high-emphasis); font-weight: 500; }
.fp__s:hover, .fp__s[aria-expanded="true"] { background: color-mix(in srgb, var(--text-high-emphasis) 14%, var(--card-neutral-background)); color: var(--text-high-emphasis); }
.fp__s.-v { color: var(--text-high-emphasis); font-weight: 500; }
.fp__s.-empty { color: var(--text-low-emphasis); }
.fp__x { padding: 0 6px; color: var(--icons-mid-emphasis); }
.fp__x:hover { color: var(--text-error-accent); }
.fp__x svg { width: 12px; height: 12px; }
.btn.-addf { font-weight: 400; color: var(--text-mid-emphasis); }
.btn.-addf:hover, .btn.-addf[aria-expanded="true"] { color: var(--text-high-emphasis); }
.bar .cnt { color: var(--text-mid-emphasis); white-space: nowrap; }
.addf { width: 248px; max-width: calc(100vw - 32px); }
.addf__list { max-height: min(50vh, 340px); overflow: auto; overscroll-behavior: contain; margin-top: 4px; }
.pop__row.-more { color: var(--terminal-v2-muted); }
.fv { display: grid; gap: 8px; padding: 4px; }
.fv__row { display: flex; align-items: center; gap: 8px; }
.fv__in { display: flex; align-items: center; gap: 4px; flex: 1; height: 28px; padding: 0 8px; border-radius: 6px; background: var(--dropdown-hover); color: var(--terminal-v2-muted); }
.fv__in:focus-within { outline: 1px solid var(--control-focus-border); outline-offset: -1px; }
.fv__in input { flex: 1; min-width: 0; width: 104px; height: 26px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--terminal-v2-text); }
.fv .lbl { color: var(--terminal-v2-muted); white-space: nowrap; }
.fv .qopts { padding: 0; }

/* Tabs: ready tables. A tab is its columns, their order and its conditions; the number is how many assets match the conditions now. */
.tabs { display: flex; gap: 4px; flex: none; min-width: 0; padding: 6px 8px 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .tab { height: 28px; }
.tab .n { font-variant-numeric: tabular-nums; }
.tab .n:empty { display: none; }
</style>

<script>

const NEARS = [['0.25', '0.25%'], ['0.5', '0.5%'], ['1', '1%'], ['atr', '½ ATR']];

];

function fmtPrice(v) { if (!ok(v)) return NA; const d = v >= 1000 ? 1 : v >= 100 ? 2 : v >= 1 ? 3 : v >= 0.01 ? 5 : v >= 0.0001 ? 7 : 10; return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtPct(v, d = 2, signed = true) { if (!ok(v)) return NA; const x = v * 100; const s = (signed && x > 0 ? '+' : '') + x.toFixed(d) + '%'; const cls = !signed ? '' : x > 0.0005 ? 'pos' : x < -0.0005 ? 'neg' : 'mid'; return `<span class="${cls}">${s}</span>`; }

function aggregate() {

// Opening the popover of another button or phrase closes the current one; the same button again just closes.
function openPop(name, k) {

/* ========================= Drag to reorder (the terminal's pointer pattern: 4px threshold, coloured source, edge line on the target) ========================= */
function makeDrag(root, selector, axis, canDrag, keepPop) {

makeDrag($('thead'), 'th[data-k]', 'x', () => true);
makeDrag($('pop'), '.dl__row', 'y', () => true, true);

/* ========================= Events ========================= */
const OPENERS = new Set(['pop', 'fop', 'fval', 'lop', 'lval', 'sval']);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  const row = !t && e.target.closest('#tbody tr[data-id]');
  if (row) { F.selected = row.dataset.id; renderBody(); }
  if (!t) { if (!e.target.closest('#pop')) closePop(); return; }
  if (t.disabled) return;
  const a = t.dataset.a, v = t.dataset.v, k = t.dataset.k, m = t.dataset.m;
  if (OPENERS.has(a)) return openPop(a === 'pop' ? v : a, a === 'pop' ? null : k);
  if (!t.closest('#pop')) closePop();
  switch (a) {
    case 'tab': return switchTab(v);
    case 'ex': toggleEx(v); return render();
    case 'cls': F.cls = v; if (F.sector && !sectorCounts().some(s => s[0] === F.sector)) dropFilter('sector'); closePop(); return render();
    case 'addf': return openPop(addFilter(k), k);
    case 'setop': { const f = F.nums[k]; f.op = v; if (v !== 'between') f.v2 = null; if (ok(f.v) && v !== 'between') { closePop(); return render(); } return openPop('fval', k); }
    case 'qset': F.nums[k] = { op: t.dataset.op, v: +v, v2: null }; closePop(); return render();
    case 'lv': F.levels[k] = m; closePop(); return render();
    case 'near': F.near = v; closePop(); return render();
    case 'sector': F.sector = v; closePop(); return render();
    case 'chipx': dropFilter(k); closePop(); return render();
    case 'clear': resetFilters(); closePop(); return render();
    case 'col': if (F.cols.includes(k)) hideCol(k); else addCol(k); return render();
    case 'hide': hideCol(k); return render();
    case 'reset': Object.assign(F, cleanView(null, F.tab)); return render();
    case 'sort': {   // header click: first direction, the other one, then back to the default order
      const c = COL[k]; if (!c || !c.val) return; const first = c.text ? 'asc' : 'desc', second = c.text ? 'desc' : 'asc', s = F.sort;
      F.sort = s.key !== k ? { key: k, dir: first } : s.dir === first ? { key: k, dir: second } : { key: null, dir: null };
      saveView(); renderHead(); return renderBody();
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { F.search = t.value; return renderBody(); }
  if (t.id === 'catq') { CAT.q = t.value; $('catlist').innerHTML = catalogList(); return; }
  if (t.id === 'addq') { ADDQ = t.value; $('addlist').innerHTML = addList(); return; }
  if (t.id === 'fvin' || t.id === 'fvin2') {   // the table answers while the value is typed
    const f = F.nums[t.dataset.k]; if (!f) return;
    f[t.id === 'fvin' ? 'v' : 'v2'] = parseValue(t.dataset.k, t.value); saveView(); renderTop(); renderHead(); renderBody();
  }
});
document.addEventListener('keydown', e => {
  const id = e.target && e.target.id;
  if (e.key === 'Escape' && POP.name) { closePop(); return render(); }
  if (e.key !== 'Enter') return;
  if (id === 'fvin' && $('fvin2')) { e.preventDefault(); return $('fvin2').focus(); }
  if (id === 'fvin' || id === 'fvin2') { e.preventDefault(); closePop(); return render(); }
  if (id === 'addq') { const first = document.querySelector('#addlist [data-a="addf"]'); if (first) { e.preventDefault(); first.click(); } }
});
$('wrap').addEventListener('scroll', e => { e.currentTarget.classList.toggle('-scrolled', e.currentTarget.scrollLeft > 0); if (TIP.id) { TIP.id = null; paintTip(); } });
$('tbody').addEventListener('mouseover', e => {
  const td = e.target.closest('td[data-k]'), tr = td && td.parentElement, k = td ? td.dataset.k : null;
  if (k && TIPF[k] && tr.dataset.id) { if (TIP.id !== tr.dataset.id || TIP.k !== k) { TIP.id = tr.dataset.id; TIP.k = k; paintTip(); } }
  else if (TIP.id) { TIP.id = null; paintTip(); }
});
$('wrap').addEventListener('mouseleave', () => { if (TIP.id) { TIP.id = null; paintTip(); } });

if (typeof ResizeObserver === 'function') new ResizeObserver(() => layout()).observe($('wrap')); else addEventListener('resize', layout);

/* ========================= Live data =========================
   The page opens on the snapshot built into it. Served by the screener service it goes live: the service
   folds OKX, Binance and Bybit into one row per asset (GET /assets) and pushes the rows about once a second
   (GET /stream?view=assets). Which exchanges go into a row is chosen here, so the page adds up the blocks itself. */
let paintTimer = null;
function touch() {   // one redraw per batch of updates
  if (paintTimer) return;
  paintTimer = setTimeout(() => { paintTimer = null; if (document.body.classList.contains('-dragging')) return; PAINT_LIVE = true; aggregate(); renderBody(); PAINT_LIVE = false; }, 250);
}
function applyAssets(d) {
  if (!d || !Array.isArray(d.assets) || !d.assets.length) throw new Error('no assets');
  DATA.assets = d.assets; ASSET.clear(); for (const a of d.assets) ASSET.set(a.k, a);

async function getJson(url, ms = 8000) {

}

  if (location.protocol !== 'http:') return;   // the local service; a published copy stays on its snapshot

  es.addEventListener('assets', e => { try { applyAssets(JSON.parse(e.data)); touch(); } catch (err) { console.warn(err); } });
  es.addEventListener('error', startPoll);   // the stream reconnects by itself; polling covers the gap
  es.addEventListener('open', () => { clearInterval(poll); poll = null; });
}

/* ========================= Boot ========================= */
aggregate(); render(); startFeeds();
