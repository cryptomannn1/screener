<style>
/* Terminal kit: tokens and components copied from screener-v1.html */
__KIT_CSS__

/* ===== Lab additions: a clean default table and three ways to manage its columns ===== */
.lab__note { flex: none; min-height: 16px; max-width: 132ch; color: var(--text-mid-emphasis); }
.lab .btn.-ghost[aria-pressed="true"] { background: var(--card-neutral-background); color: var(--text-high-emphasis); }
.lab__lbl { color: var(--text-low-emphasis); }

.bar { position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; min-height: 40px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.bar.-sub { background: var(--widget-header-background); }
.bar__grow { flex: 1 1 0; min-width: 8px; }
.scr__tabs.-views { flex: none; }
.btn.-primary { border-color: transparent !important; background: var(--primary-accent); color: var(--text-light); }
.btn.-primary:hover { background: var(--primary-deep); }
.btn.-add { height: 24px; padding: 0 8px 0 6px; border-style: dashed; background: transparent; color: var(--text-mid-emphasis); font-weight: 400; }
.btn.-add:hover { color: var(--text-high-emphasis); }
.btn.-add svg { width: 12px; height: 12px; }
.seg button i, .opt i { margin-left: 4px; font-style: normal; font-weight: 400; color: var(--text-low-emphasis); }

/* Header: reorder by dragging (as the terminal's Positions table), a menu caret on hover, a remove cross in customize mode */
.trading-table.-reorder th[data-k]:not([data-k="symbol"]) { cursor: grab; touch-action: none; }
.trading-table th[data-dragging] { color: var(--primary-accent); cursor: grabbing; }
.trading-table th[data-drop-edge="before"] { box-shadow: inset 2px 0 var(--primary-accent); }
.trading-table th[data-drop-edge="after"] { box-shadow: inset -2px 0 var(--primary-accent); }
body.-dragging, body.-dragging * { cursor: grabbing !important; user-select: none; }
.trading-table th:hover, .trading-table th:has(.hm[aria-expanded="true"]) { z-index: 12; }
.trading-table th.-flt .lbl { color: var(--primary-accent); }
.hm, .hx { position: absolute; z-index: 1; top: 50%; right: -9px; display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 20px; margin-top: -10px; padding: 0; border: 0; border-radius: 4px; background: var(--widget-header-background); color: var(--icons-mid-emphasis); opacity: 0; }
.hm svg, .hx svg { width: 12px; height: 12px; }
.trading-table th:hover .hm, .hm[aria-expanded="true"] { opacity: 1; }
.hm:hover, .hm[aria-expanded="true"] { background: var(--card-neutral-background); color: var(--text-high-emphasis); }
.trading-table th:not(.-end) .hm { position: static; margin: 0 0 0 18px; vertical-align: middle; }
.trading-table.-editing thead th[data-k] { padding-right: 26px; background: var(--card-neutral-background); }
.trading-table.-editing .hx { right: 4px; opacity: 1; background: transparent; }
.hx:hover { color: var(--text-error-accent); }
.trading-table th .grip { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; color: var(--icons-low-emphasis); }
/* a text column after a numeric one keeps its label clear of the neighbour's menu button */
.trading-table th[data-k]:not(.-end):not([data-pin]), .trading-table td:not(.-end):not([data-pin]):not(.-tail) { padding-left: 24px; }
.trading-table th.-tail, .trading-table td.-tail { width: 36px; min-width: 36px; padding: 0 4px; cursor: default; }
.addcol { width: 24px; height: 24px; }
.level { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }

/* Column catalogue: metric families with a plain description; periods are chips */
.cat { width: 380px; max-width: calc(100vw - 32px); }
.cat__search { display: block; padding: 4px 4px 0; }
.cat__search input { width: 100%; max-width: none; background: var(--dropdown-hover); border-color: transparent !important; color: var(--terminal-v2-text); }
.cat__search svg { left: 12px; top: 11px; }
.cat__list { max-height: min(60vh, 520px); overflow: auto; overscroll-behavior: contain; }
.cat__item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 6px 8px; border-radius: 6px; }
.cat__item:hover { background: var(--dropdown-hover); }
.cat__text b { display: block; font-weight: 500; color: var(--terminal-v2-text); }
.cat__text span { color: var(--terminal-v2-muted); }
.cat__keys { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; max-width: 190px; }
.ck, .opt { height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: var(--dropdown-hover); color: var(--terminal-v2-muted); white-space: nowrap; }
.cat__item:hover .ck { background: color-mix(in srgb, var(--terminal-v2-text) 9%, var(--dropdown-background)); }
.ck:hover, .opt:hover { color: var(--terminal-v2-text); }
.ck[aria-pressed="true"], .opt[aria-pressed="true"] { background: var(--card-primary-background-light) !important; color: var(--terminal-v2-text); font-weight: 500; }
.pop__row .tick { margin-left: auto; width: 12px; height: 12px; color: var(--primary-accent); }
.pop__row .tick + .hint { margin-left: 0; }
.pop__foot.-split { justify-content: space-between; align-items: center; }
.pop__foot .lbl { color: var(--terminal-v2-muted); }
.pop .seg { background: var(--dropdown-hover); }
.pop .seg button[aria-pressed="true"] { background: var(--dropdown-background); color: var(--terminal-v2-text); }

/* Filters popover: one compact row of buttons per column that is in the table */
.fr { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-items: center; padding: 8px; max-width: 520px; }
.fr__l { color: var(--terminal-v2-text); font-weight: 500; white-space: nowrap; }
.qopts { display: flex; flex-wrap: wrap; gap: 4px; }
.fin { height: 24px; padding: 0 4px; border: 1px solid transparent; border-radius: 6px; background: var(--dropdown-hover); color: var(--terminal-v2-text); }
.fin.-on { border-color: var(--primary-accent); }

/* B: columns drawer, the screener's take on the Positions column settings */
.drawer { position: absolute; z-index: 40; top: 0; right: 0; bottom: 0; display: flex; flex-direction: column; width: 340px; max-width: 100%; background: var(--dropdown-background); color: var(--terminal-v2-text); box-shadow: var(--dropdown-shadow); }
.drawer[hidden] { display: none; }
.drawer__head { display: flex; align-items: center; gap: 8px; flex: none; padding: 8px 8px 4px 12px; }
.drawer__head b { font-weight: 500; }
.drawer__head .mid { color: var(--terminal-v2-muted); }
.drawer__body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 0 4px; }
.drawer__foot { display: flex; justify-content: flex-end; flex: none; padding: 8px; }
.drawer .cat { width: auto; max-width: none; }
.drawer .cat__list { max-height: none; overflow: visible; }
.dl__row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 30px; padding: 0 4px 0 8px; border-radius: 4px; cursor: grab; user-select: none; touch-action: none; }
.dl__row[data-locked] { cursor: default; color: var(--terminal-v2-muted); }
.dl__row:hover { background: var(--dropdown-hover); }
.dl__row[data-dragging] { background: var(--dropdown-hover); color: var(--primary-accent); }
.dl__row[data-drop-edge="before"] { box-shadow: inset 0 2px var(--primary-accent); }
.dl__row[data-drop-edge="after"] { box-shadow: inset 0 -2px var(--primary-accent); }
.dl__grip { width: 12px; height: 12px; color: var(--icons-low-emphasis); }
.dl__x { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--icons-mid-emphasis); opacity: 0; }
.dl__row:hover .dl__x, .dl__x:focus-visible { opacity: 1; }
.dl__x:hover { color: var(--text-error-accent); }
.dl__x svg { width: 12px; height: 12px; }
@media (max-width: 720px) { .cat__keys { max-width: 150px; } }
</style>

__ICONS__

<div class="app">
  <div class="lab">
    <span class="lab__title">Screener controls lab</span>
    <div class="seg" id="variantSeg" role="group" aria-label="How columns are managed"></div>

    <button class="btn -ghost" id="presetsBtn" data-a="lpresets" aria-pressed="false" title="Preview of the future quick presets as tabs: each one is a set of columns, an order and a filter">Presets preview</button>
    <span class="lab__spacer"></span>
    <span class="lab__badge -loading" id="srcBadge"><i></i><span id="srcText">Loading</span></span>

</div>

<div class="pop" id="pop" hidden></div>

<script id="snap" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';
/* ========================= Helpers ========================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ok = v => v != null && isFinite(v);
const clone = o => JSON.parse(JSON.stringify(o));
const NA = '<span class="na">—</span>';
const store = {
  get(k, d) { try { const v = localStorage.getItem('scrlab2.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('scrlab2.' + k, JSON.stringify(v)); } catch {} },
};

const LEVELS = [['do', 'DO'], ['wo', 'WO'], ['mo', 'MO'], ['ma50', 'MA50'], ['ma100', 'MA100'], ['ma200', 'MA200']];
const LLABEL = Object.fromEntries(LEVELS);
const LTITLE = { do: "Today's open (UTC): its price and the distance to it", wo: 'Open of the week (Monday UTC): its price and the distance to it', mo: 'Open of the month (UTC): its price and the distance to it', ma50: 'MA 50 of daily closes: its price and the distance to it', ma100: 'MA 100 of daily closes: its price and the distance to it', ma200: 'MA 200 of daily closes: its price and the distance to it' };
const CROSS_H = 4;   // "crossed" means the hourly closes flipped sides within the last 4 hours
const LMODES = [['above', 'Above'], ['near', 'Near'], ['below', 'Below'], ['up', `Crossed ↑ ${CROSS_H}h`], ['down', `Crossed ↓ ${CROSS_H}h`]];
const mLabel = m => LMODES.find(x => x[0] === m)[1];
const CLASSES = [['all', 'All'], ['crypto', 'Crypto'], ['stock', 'Stocks'], ['commodity', 'Commodities']];
const CLABEL = { crypto: 'Crypto', stock: 'Stock', premarket: 'Pre-market', commodity: 'Commodity', other: 'Other' };
const NEARS = [['0.25', '0.25%'], ['0.5', '0.5%'], ['1', '1%'], ['atr', '½ ATR']];
const VARIANTS = [['A', 'A Plus in header'], ['B', 'B Column panel'], ['C', 'C Customize mode']];
const FMODES = [['menu', 'In column menu'], ['button', 'One button']];
const NOTES = {
  A: 'Таблица по умолчанию из семи колонок. Добавить: плюс в конце шапки открывает каталог метрик с описаниями. Убрать, отсортировать, отфильтровать: три точки у заголовка при наведении. Порядок: тянуть заголовок, как в Positions.',
  B: 'Та же чистая таблица. Кнопка Columns открывает панель справа, как настройки колонок в Positions: сверху то, что уже в таблице, с перетаскиванием и удалением, ниже каталог для добавления. Заголовки тоже можно тянуть.',
  C: 'В обычном режиме шапка заблокирована: случайно ничего не сдвинуть и не удалить. Кнопка Customize включает режим настройки: у заголовков появляются ручка и крестик, под панелью лента колонок для добавления одним кликом.',
};
const DEFAULT_COLS = ['symbol', 'spark', 'mark', 'chg24', 'vol24', 'oi', 'funding'];

function fmtPrice(v) { if (!ok(v)) return NA; const d = v >= 1000 ? 1 : v >= 100 ? 2 : v >= 1 ? 3 : v >= 0.01 ? 5 : 7; return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function fmtPct(v, d = 2, signed = true) { if (!ok(v)) return NA; const x = v * 100; const s = (signed && x > 0 ? '+' : '') + x.toFixed(d) + '%'; const cls = !signed ? '' : x > 0.0005 ? 'pos' : x < -0.0005 ? 'neg' : 'mid'; return `<span class="${cls}">${s}</span>`; }
function usdText(v) { const a = Math.abs(v); return '$' + (a >= 1e12 ? (v / 1e12).toFixed(2) + 'T' : a >= 1e9 ? (v / 1e9).toFixed(a >= 1e11 ? 0 : 2) + 'B' : a >= 1e6 ? (v / 1e6).toFixed(a >= 1e8 ? 0 : 1) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(0) + 'K' : v.toFixed(0)); }
const fmtUsd = v => ok(v) ? usdText(v) : NA;
const fmtX = v => ok(v) ? `<span class="${v >= 2 ? 'pos' : v < 0.6 ? 'dim' : ''}">${v.toFixed(v >= 10 ? 0 : 2)}×</span>` : NA;
// Sparkline of the prototype: baseline at the price 24 hours ago, green above it and red below.
function sparkline(vals, base) {
  if (!vals || vals.length < 2) return NA;
  if (!(base > 0)) base = vals[0];
  const w = 72, h = 22, min = Math.min(...vals, base), max = Math.max(...vals, base), span = max - min || 1;
  const y = v => h - 2 - ((v - min) / span) * (h - 4);
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 2) + 1, y(v)]);
  const by = y(base).toFixed(1), x0 = pts[0][0].toFixed(1), x1 = pts[pts.length - 1][0].toFixed(1);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = d + ` L${x1} ${by} L${x0} ${by} Z`;
  const id = 'sp' + Math.random().toString(36).slice(2, 8);
  const col = vals[vals.length - 1] >= base ? 'var(--long)' : 'var(--short)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><clipPath id="${id}a"><rect x="0" y="0" width="${w}" height="${by}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${by}" width="${w}" height="${h}"/></clipPath></defs>`
    + `<line x1="${x0}" x2="${x1}" y1="${by}" y2="${by}" stroke="var(--border-secondary, var(--border))" stroke-width="1"/>`
    + `<path d="${area}" fill="var(--long)" opacity=".16" clip-path="url(#${id}a)"/><path d="${area}" fill="var(--short)" opacity=".16" clip-path="url(#${id}b)"/>`
    + `<path d="${d}" fill="none" stroke="var(--long)" stroke-width="1.2" clip-path="url(#${id}a)"/><path d="${d}" fill="none" stroke="var(--short)" stroke-width="1.2" clip-path="url(#${id}b)"/>`
    + `<circle cx="${x1}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="1.6" fill="${col}"/></svg>`;
}

/* ========================= State ========================= */
const LAB = { variant: store.get('variant', 'A'), filter: store.get('filter', 'menu'), presets: store.get('presets', false) };
const F = {
  view: 'my', cls: 'all', sector: '', search: '',
  cols: store.get('cols', DEFAULT_COLS).filter(Boolean),
  levels: {},            // level column -> above | near | below | up | down
  near: '0.5',           // range of "near": percent of price, or half of the hourly ATR
  nums: {},              // numeric quick filters by column key: { op, v }
  sort: { key: null, dir: null },   // dir: desc | asc | near
  drawer: false, edit: false,
  selected: 'BTC-USDT-SWAP',
};
const S = { rows: [], ts: 0, live: false };
const POP = { name: null, k: null };
const CAT = { q: '' };
const VIEWS = {};

/* ========================= Data ========================= */
function norm(r) {
  return { id: r.instId, base: r.symbol, quote: r.settle || 'USDT', cls: r.class || 'crypto', sector: r.sector || '', name: r.name || '',
    mark: r.mark, last: r.last, chg: r.chg || {}, chg7d: r.chg7d, chg30d: r.chg30d, vol24: r.vol24, volx7: r.volx7, volx: r.volx || {}, oi: r.oi, oiD: r.oiD || {},
    funding: r.funding, fundingAnn: r.fundingAnn, mcap: r.mcap, mcapRank: r.mcapRank, oiMcap: r.oiMcap, atr: r.atr, regime: r.regime,
    takerBuy: r.takerBuy || {}, delta: r.delta || {}, tape: r.tape, vsBtc: r.vsBtc || {}, beta: r.beta, corr: r.corr, spread: r.spread, depth05: r.depth05,
    lv: { do: r.do, wo: r.wo, mo: r.mo, ma50: r.ma50, ma100: r.ma100, ma200: r.ma200 }, spark: r.spark || null, x: {} };
}
async function load() {
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 2500);
    const res = await fetch('/screener', { signal: ctl.signal, cache: 'no-store' }); clearTimeout(timer);
    if (!res.ok) throw new Error('http ' + res.status);
    const d = await res.json(); if (!d.rows || !d.rows.length) throw new Error('empty');
    S.rows = d.rows.map(norm); S.ts = d.ts; S.live = true;
  } catch (e) {
    if (!S.rows.length) { const d = JSON.parse($('snap').textContent); S.rows = d.rows.map(norm); S.ts = d.ts; }
    S.live = false;
  }
  const b = $('srcBadge'); b.className = 'lab__badge' + (S.live ? '' : ' -demo'); $('srcText').textContent = S.live ? 'Live' : 'Snapshot';
  b.title = S.live ? 'Rows come from the screener service on this host' : 'The service is not reachable from this page: a saved snapshot of 170 instruments is shown';
}

/* ========================= Levels and filters ========================= */
// Hourly bars since the level came into being, the forming one included: a close before that says nothing about the level.
function barsSinceStart(k) {
  const d = new Date(S.ts || Date.now()), h = d.getUTCHours() + 1;
  return k === 'do' ? h : k === 'wo' ? ((d.getUTCDay() + 6) % 7) * 24 + h : k === 'mo' ? (d.getUTCDate() - 1) * 24 + h : Infinity;
}
// The most recent hour in which an hourly close sat on the other side of the level: { dir, ago } or null.
function cross(r, k) {
  if (k in r.x) return r.x[k];
  let out = null; const l = r.lv[k], s = r.spark;
  if (l && l.px > 0 && s && s.length > 2) {
    const n = s.length; const ref = ok(r.last) && r.last > 0 ? r.last : s[n - 1]; const side = ref >= l.px ? 1 : -1;
    for (let i = n - 2; i >= Math.max(0, n - barsSinceStart(k)); i--) { const v = s[i]; if (!ok(v)) continue; if ((v >= l.px ? 1 : -1) !== side) { out = { dir: side > 0 ? 'up' : 'down', ago: n - 1 - i }; break; } }
  }
  return (r.x[k] = out);
}
function nearLimit(r) { return F.near === 'atr' ? (ok(r.atr) && r.atr > 0 ? r.atr * 0.5 : 0.005) : parseFloat(F.near) / 100; }
function levelPass(r, k, m) {
  const l = r.lv[k]; if (!l || !ok(l.dist)) return false;
  if (m === 'above') return l.dist > 0; if (m === 'below') return l.dist < 0; if (m === 'near') return Math.abs(l.dist) <= nearLimit(r);
  const c = cross(r, k); return !!c && c.dir === m && c.ago <= CROSS_H;
}
function passes(r, skipLevel) {
  if (F.cls !== 'all' && (F.cls === 'stock' ? !(r.cls === 'stock' || r.cls === 'premarket') : r.cls !== F.cls)) return false;
  if (F.sector && r.sector !== F.sector) return false;
  if (F.search) { const terms = F.search.toUpperCase().replace(/[^A-Z0-9,]/g, '').split(',').filter(Boolean); if (terms.length && !terms.some(t => r.base.includes(t))) return false; }
  for (const k in F.nums) { const f = F.nums[k], v = COL[k].val(r); if (!ok(v)) return false; if (f.op === '>=' ? v < f.v : v > f.v) return false; }
  for (const k in F.levels) { if (k !== skipLevel && !levelPass(r, k, F.levels[k])) return false; }
  return true;
}
// How many instruments would match this level condition with every other filter kept.
function countLevel(k, m) { let n = 0; for (const r of S.rows) if (passes(r, k) && levelPass(r, k, m)) n++; return n; }
function sectorCounts() { const m = new Map(); for (const r of S.rows) if (r.sector) m.set(r.sector, (m.get(r.sector) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); }
const isNum = (k, op, v) => !!(F.nums[k] && F.nums[k].op === op && F.nums[k].v === v);

const dragOn = () => LAB.variant !== 'C' || F.edit;

  $('variantSeg').innerHTML = VARIANTS.map(([v, l]) => `<button data-a="variant" data-v="${v}" aria-pressed="${LAB.variant === v}">${l}</button>`).join('');
  $('filterSeg').innerHTML = FMODES.map(([v, l]) => `<button data-a="lfilter" data-v="${v}" aria-pressed="${LAB.filter === v}" title="${v === 'menu' ? 'A filter is an action of its column: open the column menu' : 'One Filters button lists quick filters for the columns that are in the table'}">${l}</button>`).join('');
  $('presetsBtn').setAttribute('aria-pressed', LAB.presets);
  $('note').textContent = NOTES[LAB.variant];
}
function renderHead() {
  const edit = LAB.variant === 'C' && F.edit;
  $('wrap').classList.toggle('-reorder', dragOn()); $('wrap').classList.toggle('-editing', edit);
  $('thead').innerHTML = '<tr>' + F.cols.map(k => {
    const c = COL[k], s = F.sort.key === k ? F.sort.dir : null, name = esc(colLabel(c));
    const flt = !!(F.levels[k] || F.nums[k] || (k === 'sector' && F.sector));
    const icon = c.val ? `<svg class="srt"><use href="#${s === 'asc' ? 'i-up' : s === 'near' ? 'i-near' : 'i-down'}"/></svg>` : '';
    const grip = edit && k !== 'symbol' ? '<svg class="grip"><use href="#i-grip"/></svg>' : '';
    const ctl = edit ? (k !== 'symbol' ? `<button class="hx" data-a="hide" data-k="${k}" aria-label="Remove ${name}" title="Remove column"><svg><use href="#i-close"/></svg></button>` : '')
      : `<button class="hm" data-a="hmenu" data-k="${k}" aria-haspopup="true" aria-expanded="${POP.name === 'hmenu' && POP.k === k}" aria-label="${name} column menu" title="Column menu"><svg><use href="#i-more"/></svg></button>`;
    return `<th data-k="${k}" data-a="sort" class="${c.end ? '-end' : ''}${flt ? ' -flt' : ''}"${s ? ` aria-sort="${s === 'asc' ? 'ascending' : s === 'near' ? 'other' : 'descending'}"` : ''}${c.pin ? ' data-pin="left"' : ''} title="${esc(c.title || '')}"><span class="lbl">${grip}${name}${icon}</span>${ctl}</th>`;
  }).join('') + `<th class="-tail"${LAB.variant === 'A' ? ' data-pin="right"' : ''}>${LAB.variant === 'A' ? `<button class="btn -ghost -icon addcol" data-a="pop" data-v="catalog" aria-haspopup="true" aria-expanded="${POP.name === 'catalog'}" title="Add a column"><svg><use href="#i-plus"/></svg></button>` : ''}</th></tr>`;
}
function renderBody() {
  const list = sorted(S.rows.filter(r => passes(r))), limit = 400, tail = `<td class="-tail"${LAB.variant === 'A' ? ' data-pin="right"' : ''}></td>`;
  $('tbody').innerHTML = list.length ? list.slice(0, limit).map(r => `<tr data-id="${r.id}" aria-selected="${r.id === F.selected}">` + F.cols.map(k => {
    const c = COL[k];
    const html = k === 'symbol' ? `<span class="instrument-cell"><span class="instrument-cell__text"><span class="instrument-cell__base">${esc(r.base)}</span><span class="instrument-cell__rest">${esc(r.quote)} SWAP</span></span></span>`
      : k === 'spark' ? sparkline(r.spark, ok(r.chg['24h']) && r.last > 0 ? r.last / (1 + r.chg['24h']) : 0) : c.fmt(r);
    return `<td class="${c.end ? '-end' : ''}"${c.pin ? ' data-pin="left"' : ''}>${html}</td>`;
  }).join('') + tail + '</tr>').join('') : `<tr><td colspan="${F.cols.length + 1}" class="empty">No instruments match</td></tr>`;
  $('stTotal').textContent = S.rows.length; $('stShown').textContent = list.length;
  $('stUpdated').textContent = S.ts ? new Date(S.ts).toLocaleTimeString('en-GB') : 'never';
}
// Re-rendering a scrolling panel must not throw the reader back to its top or drop the caret of its search field.
function keepPanel(el, sel, paint) {
  const st = el.querySelector(sel) ? el.querySelector(sel).scrollTop : 0, focused = document.activeElement && document.activeElement.id === 'catq';
  paint();
  if (el.querySelector(sel)) el.querySelector(sel).scrollTop = st;
  if (focused && $('catq')) { const i = $('catq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}
function renderPop() {
  const el = $('pop'); if (!POP.name) { el.hidden = true; return; }
  const anchor = POP.name === 'hmenu' ? document.querySelector(`[data-a="hmenu"][data-k="${POP.k}"]`) : document.querySelector(`[data-a="pop"][data-v="${POP.name}"]`);
  if (!anchor) { POP.name = null; el.hidden = true; return; }
  keepPanel(el, '.cat__list', () => { el.innerHTML = POP.name === 'hmenu' ? popHeader(POP.k) : POP.name === 'catalog' ? catalogHtml() : popFilters(); });
  el.hidden = false; const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(POP.name === 'hmenu' ? r.left - 8 : r.right - w, innerWidth - w - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(r.bottom + 4, innerHeight - h - 8)) + 'px';
}
function renderDrawer() {
  const el = $('drawer'), open = LAB.variant === 'B' && F.drawer; el.hidden = !open; if (!open) return;
  keepPanel(el, '.drawer__body', () => {
    el.innerHTML = `<div class="drawer__head"><b>Columns</b><span class="mid">${F.cols.length} shown</span><span class="bar__grow"></span><button class="btn -ghost -icon" data-a="drawer" title="Close"><svg><use href="#i-close"/></svg></button></div>
      <div class="drawer__body"><div class="pop__group">In the table</div><div class="dl">${F.cols.map(k => `<div class="dl__row" data-k="${k}"${k === 'symbol' ? ' data-locked title="Symbol always stays first"' : ' title="Drag to reorder"'}><svg class="dl__grip"><use href="#i-grip"/></svg><span>${esc(colLabel(COL[k]))}</span>${k === 'symbol' ? '' : `<button class="dl__x" data-a="hide" data-k="${k}" title="Remove from the table" aria-label="Remove ${esc(colLabel(COL[k]))}"><svg><use href="#i-close"/></svg></button>`}</div>`).join('')}</div>
      <div class="pop__group">Add a column</div>${catalogHtml()}</div>
      <div class="drawer__foot"><button class="btn -ghost" data-a="reset">Reset to default</button></div>`;
  });
}
function render() { renderLab(); renderTop(); renderHead(); renderBody(); renderPop(); renderDrawer(); }
function closePop() { if (POP.name) { POP.name = POP.k = null; $('pop').hidden = true; document.querySelectorAll('[aria-expanded="true"][data-a="pop"], [aria-expanded="true"][data-a="hmenu"]').forEach(b => b.setAttribute('aria-expanded', 'false')); } }

/* ========================= Drag to reorder (the terminal's pointer pattern: 4px threshold, coloured source, edge line on the target) ========================= */
function makeDrag(root, selector, axis, canDrag) {
  let g = null, target = null, edge = null, suppress = false;
  const paint = () => root.querySelectorAll(selector).forEach(el => { el.toggleAttribute('data-dragging', !!(g && g.active && el.dataset.k === g.key)); if (target && el.dataset.k === target) el.dataset.dropEdge = edge; else delete el.dataset.dropEdge; });
  const finish = () => { if (suppress) setTimeout(() => { suppress = false; }, 0); g = target = edge = null; removeEventListener('pointermove', move); removeEventListener('pointerup', drop); removeEventListener('pointercancel', finish); document.body.classList.remove('-dragging'); paint(); };
  function move(e) {
    if (!g || e.pointerId !== g.id) return;
    if (!g.active && Math.hypot(e.clientX - g.x, e.clientY - g.y) < 4) return;
    g.active = true; suppress = true; e.preventDefault(); document.body.classList.add('-dragging'); closePop();
    const hit = document.elementFromPoint(e.clientX, e.clientY), el = hit && hit.closest(selector); target = edge = null;
    if (el && root.contains(el) && el.dataset.k !== g.key && el.dataset.k !== 'symbol') { target = el.dataset.k; const r = el.getBoundingClientRect(); edge = (axis === 'x' ? e.clientX < r.left + r.width / 2 : e.clientY < r.top + r.height / 2) ? 'before' : 'after'; }
    paint();
  }
  function drop(e) { if (!g || e.pointerId !== g.id) return; move(e); const k = g.key, t = target, ed = edge, did = g.active; finish(); if (did && t) { moveCol(k, t, ed); render(); } }
  root.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !canDrag() || e.target.closest('button, input, select')) return;
    const el = e.target.closest(selector); if (!el || !root.contains(el) || !el.dataset.k || el.dataset.k === 'symbol') return;
    g = { key: el.dataset.k, x: e.clientX, y: e.clientY, id: e.pointerId, active: false };
    addEventListener('pointermove', move); addEventListener('pointerup', drop); addEventListener('pointercancel', finish);
  });
  root.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
}
makeDrag($('thead'), 'th[data-k]', 'x', dragOn);
makeDrag($('drawer'), '.dl__row', 'y', () => true);

/* ========================= Events ========================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  const row = !t && e.target.closest('#tbody tr[data-id]');
  if (row) { F.selected = row.dataset.id; const r = S.rows.find(x => x.id === F.selected); if (r) { $('headerSymbolText').textContent = r.base; $('headerSymbolRest').textContent = r.quote + ' SWAP'; } renderBody(); }
  if (!t) { if (!e.target.closest('#pop')) closePop(); return; }
  const a = t.dataset.a, v = t.dataset.v, k = t.dataset.k, m = t.dataset.m;
  if (a !== 'pop' && a !== 'hmenu' && !t.closest('#pop')) closePop();
  switch (a) {
    case 'variant': LAB.variant = v; store.set('variant', v); closePop(); F.edit = false; F.drawer = false; return render();
    case 'lfilter': LAB.filter = v; store.set('filter', v); closePop(); return render();
    case 'lpresets': LAB.presets = !LAB.presets; store.set('presets', LAB.presets); if (!LAB.presets) switchView('my'); return render();
    case 'theme': { const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme = dark ? 'light' : 'dark'; return; }
    case 'view': switchView(v); return render();
    case 'pop': if (POP.name === v) return closePop(); POP.name = v; POP.k = null; CAT.q = ''; render(); if (v === 'catalog' && $('catq')) $('catq').focus(); return;
    case 'hmenu': if (POP.name === 'hmenu' && POP.k === k) return closePop(); POP.name = 'hmenu'; POP.k = k; return render();
    case 'cls': F.cls = v; if (v === 'stock' || v === 'commodity') F.sector = ''; return render();
    case 'near': F.near = v; return render();
    case 'sector': F.sector = F.sector === v ? '' : v; return render();
    case 'lv': toggleLevel(k, m); return render();
    case 'num': toggleNum(k, t.dataset.op, +v); return render();
    case 'chipx': if (v === 'sector') F.sector = ''; else if (v === 'num') delete F.nums[k]; else delete F.levels[k]; return render();
    case 'clear': F.sector = ''; F.nums = {}; F.levels = {}; closePop(); return render();
    case 'col': if (F.cols.includes(k)) hideCol(k); else addCol(k); return render();
    case 'hide': hideCol(k); closePop(); return render();
    case 'nudge': nudgeCol(k, +v); return render();
    case 'reset': F.cols = DEFAULT_COLS.slice(); F.nums = {}; F.levels = {}; F.sector = ''; F.sort = { key: null, dir: null }; saveCols(); closePop(); return render();
    case 'drawer': F.drawer = !F.drawer; CAT.q = ''; return render();
    case 'edit': F.edit = !F.edit; closePop(); return render();
    case 'sortset': F.sort = F.sort.key === k && F.sort.dir === v ? { key: null, dir: null } : { key: k, dir: v }; closePop(); return render();
    case 'sort': {   // header click: first direction, the other one, then back to the default order
      const c = COL[k]; if (!c || !c.val) return; const first = c.text ? 'asc' : 'desc', second = c.text ? 'desc' : 'asc', s = F.sort;
      F.sort = s.key !== k ? { key: k, dir: first } : s.dir === first ? { key: k, dir: second } : { key: null, dir: null };
      renderHead(); return renderBody();
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { F.search = t.value; return renderBody(); }
  if (t.id === 'catq') { CAT.q = t.value; $('catlist').innerHTML = catalogList(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.f === 'sector') { F.sector = t.value; render(); } });
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (POP.name) return closePop(); if (F.drawer) { F.drawer = false; return render(); } if (F.edit) { F.edit = false; render(); } });
$('wrap').addEventListener('scroll', e => { e.currentTarget.classList.toggle('-scrolled', e.currentTarget.scrollLeft > 0); if (POP.name === 'hmenu') closePop(); });

/* ========================= Boot ========================= */
(async function boot() {
  await load(); render();
  if (S.live) setInterval(async () => { await load(); renderBody(); }, 3000);
})();
</script>
