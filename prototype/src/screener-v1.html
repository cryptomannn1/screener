<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scope360 Screener</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: the terminal's maximized widget frame filling the viewport; a slim prototype bar above it. */
:root {
  --font: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
  /* terminal-front _theme.scss, light */
  --white: #ffffff; --black: #141414;
  --neutral-800: #1c2026; --neutral-700: #6e6e72; --neutral-600: #7f7f83; --neutral-500: #8e8e93;
  --neutral-400: #ababae; --neutral-300: #c3c3c5; --neutral-200: #d9d9da; --neutral-100: #ededed;
  --neutral-50: #f6f6f6; --neutral-25: #fafafa;
  --blue-500: #007aff; --blue-400: #729eff; --blue-300: #a1bbff; --blue-800: #004da1;
  --green-500: #56b683; --green-700: #438d65; --green-800: #367353; --green-300: #aed6bf;
  --red-500: #f18169; --red-700: #bb6451; --red-800: #985242; --red-300: #f7beb5;
  --orange-500: #ff6f00; --orange-400: #ffa432; --yellow-500: #ffcc00;

  --terminal-v2-text: #202326; --terminal-v2-muted: #60676a;
  --dropdown-background: #ffffff;
  --dropdown-hover: color-mix(in srgb, var(--terminal-v2-text) 5%, var(--dropdown-background));
  --dropdown-border: color-mix(in srgb, var(--terminal-v2-text) 10%, transparent);
  --dropdown-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  --table-pin-shadow: rgb(0 0 0 / 25%);
  --primary-accent: var(--blue-500); --primary-deep: var(--blue-800);
  --control-focus-border: color-mix(in srgb, var(--primary-deep) 45%, var(--terminal-v2-muted));
  --text-high-emphasis: var(--neutral-800); --text-mid-emphasis: var(--neutral-500); --text-low-emphasis: var(--neutral-400);
  --text-light: var(--white); --text-success-accent: var(--green-500); --text-error-accent: var(--red-500);
  --text-warning-accent: var(--orange-500); --text-attention-accent: var(--yellow-500);
  --icons-mid-emphasis: var(--neutral-500); --icons-low-emphasis: var(--neutral-300);
  --card-background: var(--white); --dark-background: var(--neutral-800); --app-background: var(--neutral-25);
  --card-primary-background-light: #e4ebff; --card-neutral-background: var(--neutral-100);
  --card-success-background-light: #e7f2eb; --card-error-background-light: #fcebe9;
  --border: var(--neutral-100); --border-secondary: transparent; --background-secondary: transparent;
  --long: var(--green-500); --short: var(--red-500);
  --widget-background: var(--white); --widget-header-background: var(--neutral-25);
  --link-group-orange: var(--orange-500);
  --depth-bid-fill: rgba(86, 182, 131, 0.16); --depth-ask-fill: rgba(241, 129, 105, 0.16);
  --cell-border: var(--border);
  --shadow-elevate: 0 0 0 1px rgba(0,0,0,.06), 0 6px 6px -3px rgba(0,0,0,.06), 0 24px 24px -12px rgba(0,0,0,.04), 0 24px 24px 2px rgba(0,0,0,.1);
  --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-24: 24px; --space-32: 32px;
  --radius-4: 4px; --radius-6: 6px; --radius-8: 8px;
  --duration-fast: 120ms; --duration-base: 200ms; --duration-slow: 320ms; --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --row-h: 38px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --terminal-v2-text: var(--neutral-50); --terminal-v2-muted: var(--neutral-500);
  --dropdown-background: #1a1a1c; --dropdown-shadow: 0 8px 24px rgba(0,0,0,.32);
  --primary-deep: var(--blue-300);
  --text-high-emphasis: var(--neutral-50); --text-mid-emphasis: var(--neutral-500); --text-low-emphasis: var(--neutral-700);
  --icons-mid-emphasis: var(--neutral-500); --icons-low-emphasis: var(--neutral-700);
  --card-background: #101011; --app-background: #090909;
  --card-primary-background-light: #007aff26; --card-neutral-background: #1c1c1e;
  --card-success-background-light: #56b68326; --card-error-background-light: #f1816926;
  --border: #292929; --border-secondary: #3e3e3e; --background-secondary: #292929;
  --widget-background: #101011; --widget-header-background: #161617;
  --link-group-orange: var(--orange-400);
  --depth-bid-fill: rgba(86,182,131,.22); --depth-ask-fill: rgba(241,129,105,.22);
  --cell-border: var(--border);
  --shadow-elevate: 0 0 0 1px rgba(255,255,255,.08), 0 6px 6px -3px rgba(0,0,0,.4), 0 24px 24px -12px rgba(0,0,0,.32), 0 24px 24px 2px rgba(0,0,0,.4);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --terminal-v2-text: var(--neutral-50); --terminal-v2-muted: var(--neutral-500);
  --dropdown-background: #1a1a1c; --dropdown-shadow: 0 8px 24px rgba(0,0,0,.32);
  --primary-deep: var(--blue-300);
  --text-high-emphasis: var(--neutral-50); --text-mid-emphasis: var(--neutral-500); --text-low-emphasis: var(--neutral-700);
  --icons-mid-emphasis: var(--neutral-500); --icons-low-emphasis: var(--neutral-700);
  --card-background: #101011; --app-background: #090909;
  --card-primary-background-light: #007aff26; --card-neutral-background: #1c1c1e;
  --card-success-background-light: #56b68326; --card-error-background-light: #f1816926;
  --border: #292929; --border-secondary: #3e3e3e; --background-secondary: #292929;
  --widget-background: #101011; --widget-header-background: #161617;
  --link-group-orange: var(--orange-400);
  --depth-bid-fill: rgba(86,182,131,.22); --depth-ask-fill: rgba(241,129,105,.22);
  --cell-border: var(--border);
  --shadow-elevate: 0 0 0 1px rgba(255,255,255,.08), 0 6px 6px -3px rgba(0,0,0,.4), 0 24px 24px -12px rgba(0,0,0,.32), 0 24px 24px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--app-background); color: var(--text-high-emphasis);
  font-family: var(--font); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; letter-spacing: normal; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--control-focus-border); outline-offset: -1px; }
svg { display: block; }

.app { height: 100%; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* Prototype bar: not part of the terminal, just the lab controls */
.lab { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; color: var(--text-mid-emphasis); }
.lab__title { color: var(--text-high-emphasis); font-weight: 500; }
.lab__spacer { flex: 1; }
.lab__badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-background); }
.lab__badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--long); }
.lab__badge.-demo i { background: var(--orange-500); }
.lab__badge.-loading i { background: var(--text-low-emphasis); animation: breathe 1s infinite alternate; }
@keyframes breathe { to { opacity: .3; } }

/* Buttons from the kit: -sm secondary, -no-border */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-background); color: var(--text-high-emphasis); font-weight: 500; white-space: nowrap; transition: background-color .1s ease-out; }
.btn:hover { background: var(--card-neutral-background); }
.btn.-ghost { border-color: transparent; background: transparent; color: var(--text-mid-emphasis); }
.btn.-ghost:hover { color: var(--text-high-emphasis); background: var(--dropdown-hover); }
.btn.-icon { width: 28px; padding: 0; }
.btn[aria-expanded="true"], .btn.-on { background: var(--card-neutral-background); color: var(--text-high-emphasis); }
.btn svg { width: 14px; height: 14px; }
.btn .count { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--primary-accent); color: var(--text-light); font-size: 10px; line-height: 16px; text-align: center; }
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { border-color: var(--border-secondary); }
:root[data-theme="light"] .btn { border-color: var(--border); }

/* Widget frame */
.widget-frame { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--widget-background); }
.widget-frame__header { display: flex; align-items: center; gap: 6px; height: 32px; flex: none; padding: 0 6px; border-bottom: 1px solid var(--border); background: var(--widget-header-background); user-select: none; }
.widget-frame__grip { color: var(--icons-low-emphasis); }
.widget-frame__grip svg { width: 12px; height: 12px; }
.widget-frame__title { color: var(--text-mid-emphasis); }
.header-symbol { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; color: var(--text-high-emphasis); font-weight: 600; }
.header-symbol:hover { background: var(--dropdown-hover); }
.header-symbol i { width: 8px; height: 8px; border-radius: 50%; background: var(--link-group-orange); }
.header-symbol small { font-weight: 400; color: var(--text-mid-emphasis); }
.widget-frame__actions { margin-left: auto; display: flex; gap: 2px; }
.widget-frame__actions .btn { height: 24px; width: 24px; }

/* Toolbar (positions__toolbar) */
.scr__toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; flex: none; padding: 4px 8px; border-bottom: 1px solid var(--border); }
.scr__tabs { display: flex; gap: 4px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.scr__tabs::-webkit-scrollbar { display: none; }
.tab { height: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text-mid-emphasis); white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 400; }
.tab:hover { color: var(--text-high-emphasis); }
.tab[aria-pressed="true"] { background: var(--card-neutral-background); color: var(--text-high-emphasis); font-weight: 500; }
.tab svg { width: 12px; height: 12px; }
.tab .n { color: var(--text-low-emphasis); font-weight: 400; }
.scr__actions { display: flex; align-items: center; gap: 8px; flex: none; }

/* Search input (kit input -sm) */
.search { position: relative; }
.search input { height: 28px; width: 180px; max-width: 40vw; padding: 0 8px 0 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-background); color: var(--text-high-emphasis); }
.search input::placeholder { color: var(--text-mid-emphasis); }
.search input:hover { border-color: var(--primary-accent); }
.search svg { position: absolute; left: 8px; top: 7px; width: 14px; height: 14px; color: var(--icons-mid-emphasis); pointer-events: none; }
:root[data-theme="dark"] .search input, :root:not([data-theme="light"]) .search input { border-color: var(--border-secondary); }
:root[data-theme="light"] .search input { border-color: var(--border); }

/* Segmented period switch (dropdown-trigger look) */
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--card-neutral-background); }
.seg button { height: 24px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--text-mid-emphasis); }
.seg button[aria-pressed="true"] { background: var(--widget-background); color: var(--text-high-emphasis); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }

/* Filter strip */
.scr__filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: none; padding: 6px 8px; border-bottom: 1px solid var(--border); background: var(--widget-header-background); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card-background); color: var(--text-mid-emphasis); font-weight: 500; white-space: nowrap; }
.chip b { color: var(--text-high-emphasis); font-weight: 500; }
.chip button { display: inline-flex; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--icons-mid-emphasis); align-items: center; justify-content: center; }
.chip button:hover { color: var(--text-error-accent); }
.chip button svg { width: 12px; height: 12px; }
:root[data-theme="dark"] .chip, :root:not([data-theme="light"]) .chip { border-color: var(--border-secondary); background: var(--background-secondary); }
:root[data-theme="light"] .chip { border-color: var(--border); background: var(--card-background); }
.scr__filters .muted { color: var(--text-mid-emphasis); }

/* Table (widget-table + DataTable -sm) */
.scr__body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.trading-table { flex: 1; min-height: 0; overflow: auto; margin-right: 2px; scrollbar-gutter: stable; scrollbar-color: var(--border) var(--widget-background); }
.trading-table table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
.trading-table th, .trading-table td { padding: 0 8px; vertical-align: middle; white-space: nowrap; }
.trading-table th { position: sticky; top: 0; z-index: 10; height: 32px; background: var(--widget-header-background); color: var(--text-mid-emphasis); font-weight: 400; text-align: left; user-select: none; cursor: pointer; }
.trading-table th.-end, .trading-table td.-end { text-align: right; }.trading-table th.-end { padding-left: 22px; }
.trading-table th .lbl { position: relative; display: inline-block; }
.trading-table th .srt { position: absolute; left: calc(100% + 2px); top: 1px; opacity: 0; width: 12px; height: 12px; }
.trading-table th.-end .srt { left: auto; right: calc(100% + 2px); }
.trading-table th:hover .srt, .trading-table th[aria-sort] .srt { opacity: 1; }
.trading-table th[aria-sort] { color: var(--text-high-emphasis); }
/* Mark price: running figure from the terminal control bar (AnimatedNumber.vue), tone="none":
   the digits tween to the new value and the tick takes the side's colour at once, then the
   figure fades back to the text colour. No resting colour: 517 rows would paint the whole column. */
.mark-cell { display: inline-block; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mark-cell.-flash-up { animation: animated-number-flash-up var(--duration-base) var(--ease-standard); }
.mark-cell.-flash-down { animation: animated-number-flash-down var(--duration-base) var(--ease-standard); }
@keyframes animated-number-flash-up { from { color: var(--long); } }
@keyframes animated-number-flash-down { from { color: var(--short); } }
.level { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.level__px { color: var(--text-high-emphasis); }
.trading-table td { height: var(--row-h); overflow: hidden; text-overflow: ellipsis; }
.trading-table tr:hover td { background: var(--card-neutral-background); }
.trading-table tr[aria-selected="true"] td { background: var(--card-primary-background-light); }
.trading-table tr { cursor: pointer; }
.trading-table td[data-pin], .trading-table th[data-pin] { position: sticky; background: var(--widget-background); }
.trading-table th[data-pin] { background: var(--widget-header-background); z-index: 11; }
.trading-table td[data-pin="left"], .trading-table th[data-pin="left"] { left: 0; }
.trading-table td[data-pin="right"], .trading-table th[data-pin="right"] { right: 0; }
.trading-table tr:hover td[data-pin] { background: var(--card-neutral-background); }
.trading-table tr[aria-selected="true"] td[data-pin] { background: color-mix(in srgb, var(--primary-accent) 15%, var(--widget-background)); }
.trading-table.-scrolled td[data-pin="left"], .trading-table.-scrolled th[data-pin="left"] { box-shadow: 4px 0 6px -4px var(--table-pin-shadow); }
.pos { color: var(--long); } .neg { color: var(--short); } .dim { color: var(--text-low-emphasis); } .mid { color: var(--text-mid-emphasis); }
.na { color: var(--text-low-emphasis); }

.instrument-cell { display: flex; align-items: center; gap: 8px; }
.star { display: inline-flex; width: 16px; height: 16px; padding: 0; border: 0; background: transparent; color: var(--icons-low-emphasis); opacity: 0; align-items: center; justify-content: center; flex: none; }
.star svg { width: 12px; height: 12px; }
tr:hover .star, .star.-on { opacity: 1; }
.star.-on { color: var(--text-attention-accent); }
.star:hover { color: var(--text-high-emphasis); }
.instrument-cell__base { color: var(--text-high-emphasis); font-weight: 600; }
.instrument-cell__rest { font-size: 10px; line-height: 12px; color: var(--text-low-emphasis); }
.instrument-cell__text { display: flex; flex-direction: column; line-height: 1.2; }
.spark { width: 72px; height: 22px; }
.bar { display: inline-flex; align-items: center; gap: 6px; }
.bar i { display: inline-block; width: 40px; height: 4px; border-radius: 2px; background: var(--card-neutral-background); position: relative; overflow: hidden; }
.bar i b { position: absolute; top: 0; bottom: 0; left: 0; background: var(--long); border-radius: 2px; }
.bar i b.-short { background: var(--short); }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 6px; font-size: 10px; line-height: 12px; font-weight: 500; }
.badge.-sq { background: var(--card-primary-background-light); color: var(--primary-accent); }
.badge.-ex { background: var(--card-error-background-light); color: var(--text-error-accent); }
.row-menu-btn { opacity: 0; }
tr:hover .row-menu-btn, .row-menu-btn[aria-expanded="true"] { opacity: 1; }
.empty { padding: 24px; color: var(--text-mid-emphasis); text-align: center; }
.skeleton { display: inline-block; width: 48px; height: 10px; border-radius: 4px; background: var(--card-neutral-background); animation: breathe 1s infinite alternate; }

/* Status bar */
.scr__status { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; flex: none; padding: 6px 8px; border-top: 1px solid var(--border); color: var(--text-mid-emphasis); background: var(--widget-header-background); }
.scr__status b { color: var(--text-high-emphasis); font-weight: 500; }
.scr__status .spacer { flex: 1; }

/* Popovers (dropdown-surface + dropdown-row) */
.pop { position: fixed; z-index: 100; min-width: 200px; padding: 4px; border-radius: 8px; background: var(--dropdown-background); color: var(--terminal-v2-text); box-shadow: var(--dropdown-shadow); }
.pop[hidden] { display: none; }
.pop__row { display: flex; align-items: center; gap: 8px; min-height: 32px; width: 100%; padding: 8px; border: 0; border-radius: 4px; background: transparent; color: var(--terminal-v2-text); text-align: left; }
.pop__row:hover { background: var(--dropdown-hover); }
.pop__row[aria-checked="true"] { font-weight: 500; }
.pop__row .box { display: grid; place-items: center; width: 16px; height: 16px; flex: none; border: 1px solid var(--dropdown-border); border-radius: 4px; }
.pop__row[aria-checked="true"] .box { border-color: transparent; }
.pop__row .box svg { width: 12px; height: 12px; }
.pop__row .hint { margin-left: auto; color: var(--terminal-v2-muted); font-size: 10px; }
.pop__row.-danger { color: var(--text-error-accent); }
.pop__group { padding: 10px 8px 4px; color: var(--terminal-v2-muted); font-size: 10px; line-height: 12px; letter-spacing: .4px; text-transform: uppercase; }
.pop__sep { height: 1px; margin: 4px 0; background: var(--dropdown-border); }
.pop__cols { display: grid; grid-template-columns: repeat(3, minmax(150px, 1fr)); gap: 0 8px; max-height: 60vh; overflow: auto; }
.pop__wrap { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 0 8px; }
.sector { white-space: nowrap; }
.pop__form { display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; align-items: center; }
.pop__form select, .pop__form input { height: 28px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--dropdown-border); background: var(--dropdown-hover); color: var(--terminal-v2-text); }
.pop__form input { width: 90px; }
.pop__form .btn { border-color: transparent; background: var(--primary-accent); color: var(--text-light); }
.pop__form .btn:hover { background: var(--primary-deep); }
.pop__foot { display: flex; gap: 6px; padding: 8px; justify-content: flex-end; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1500; display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--dark-background); color: var(--text-light); pointer-events: none; opacity: 0; transition: opacity .12s ease-out; }
.toast.-show { opacity: 1; }
.toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--link-group-orange); }

@media (max-width: 720px) {
  .scr__tabs { flex-basis: 100%; }
  .scr__actions { margin-left: auto; flex-wrap: wrap; }
  .pop__cols { grid-template-columns: 1fr; }
  .search input { width: 140px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grip" viewBox="0 0 16 16"><path fill="currentColor" d="M2 3h12v1.5H2zM2 7.25h12v1.5H2zM2 11.5h12V13H2z"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>

const store = {

  set(k, v) { try { localStorage.setItem('scr.' + k, JSON.stringify(v)); } catch {} },

/* ========================= State ========================= */
const S = {

  server: new URLSearchParams(location.search).get('server') || (/^https?:$/.test(location.protocol) ? location.origin : 'http://localhost:8090'),
  poll: null,
  es: null,                 // EventSource of /stream

/* ========================= Columns ========================= */
const NA = null;
// Mark price as a running figure, ported from terminal-front control bar
// (useAnimatedNumber.js + AnimatedNumber.vue, tone="none"): the digits tween from the
// value on screen to the new one over NUMBER_TWEEN_MS with a cubic ease-out and the tick
// flashes the side's colour, then fades back to the text colour. A redraw without a
// change (sort, search) neither tweens nor flashes.
const NUMBER_TWEEN_MS = 200;
const MARK_ANIM = new Map(); // instId -> { shown, to, from, startedAt, dir, flash }
let markFrame = null;
function canAnimateFrames() {
  return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) && !document.hidden;
}
function markCell(r) {
  if (r.mark == null || !isFinite(r.mark)) { MARK_ANIM.delete(r.instId); return na(); }
  let s = MARK_ANIM.get(r.instId);
  if (!s) { s = { shown: r.mark, to: r.mark, from: r.mark, startedAt: null, dir: '', flash: '' }; MARK_ANIM.set(r.instId, s); }
  else if (r.mark !== s.to) {
    s.from = s.shown; s.to = r.mark; s.dir = r.mark > s.from ? 'up' : 'down'; s.flash = s.dir;
    if (canAnimateFrames()) { s.startedAt = performance.now(); runMarkTween(); }
    else { s.shown = r.mark; s.startedAt = null; }
  } else s.flash = '';
  const cls = ['mark-cell', s.flash && '-flash-' + s.flash].filter(Boolean).join(' ');
  return `<span class="${cls}">$${fmtPrice(s.shown)}</span>`;
}
function runMarkTween() {
  if (markFrame !== null) return;
  const tb = $('tbody');
  const step = now => {
    let active = false;
    for (const [id, s] of MARK_ANIM) {
      if (s.startedAt == null) continue;
      const p = Math.min(1, (now - s.startedAt) / NUMBER_TWEEN_MS);
      const eased = 1 - (1 - p) ** 3;
      s.shown = p >= 1 ? s.to : s.from + (s.to - s.from) * eased;
      if (p >= 1) s.startedAt = null; else active = true;
      const el = tb.querySelector(`tr[data-id="${id}"] .mark-cell`);
      if (el) el.textContent = '$' + fmtPrice(s.shown);
    }
    markFrame = active ? requestAnimationFrame(step) : null;
  };
  markFrame = requestAnimationFrame(step);
}
const COLS = [
  { key: 'symbol', group: 'Instrument', label: 'Symbol', pin: 'left', def: true, width: 150, title: 'Instrument. Click a row to switch the linked chart, order book and order form.' },

  { key: 'class', group: 'Instrument', label: 'Class', def: false, text: true, title: 'Asset class as the venue lists it: crypto, stock (tokenised equities, ETFs, indices), commodity, pre-market.', fmt: r => r.cls ? `<span class="mid">${CLASS_LABEL[r.cls] || r.cls}</span>` : na(), val: r => r.cls || null },
  { key: 'mark', group: 'Price', label: 'Mark', end: true, def: true, title: 'Mark price in USD: the price liquidations and PnL are computed from.', fmt: r => markCell(r), val: r => r.mark },
  { key: 'chgP', group: 'Price', label: () => `Chg ${S.period}`, end: true, def: true, title: 'Price change over the selected period.', fmt: r => fmtPct(P(r, 'chg')), val: r => P(r, 'chg') },
  { key: 'chg1d', group: 'Price', label: 'Chg 1D', end: true, def: true, title: 'Change against yesterday\'s UTC daily close. Server definition; the browser source uses the rolling 24h open.', fmt: r => fmtPct(r.chg1d), val: r => r.chg1d },

  { key: 'chg30d', group: 'Price', label: 'Chg 30D', end: true, def: false, title: 'Change against the daily close 30 days ago.', fmt: r => fmtPct(r.chg30d), val: r => r.chg30d },
  { key: 'basis', group: 'Price', label: 'Basis', end: true, def: false, title: 'Mark minus index, as a share of index. Premium of the perpetual over spot.', fmt: r => fmtPct(r.basis, 3), val: r => r.basis },

  { key: 'volxP', group: 'Volume', label: () => `Vol × ${S.period}`, end: true, def: false, title: 'Volume of the selected period against the average of the same period over the previous 7 days.', fmt: r => fmtX(P(r, 'volx')), val: r => P(r, 'volx') },
  { key: 'oi', group: 'Open interest', label: 'OI', end: true, def: true, title: 'Open interest in USD.', fmt: r => fmtUsd(r.oi), val: r => r.oi },
  { key: 'mcap', group: 'Capitalisation', label: 'Mcap', end: true, def: true, title: 'Market capitalisation in USD (crypto only, CoinGecko, refreshed every 30 minutes).', fmt: r => fmtUsd(r.mcap), val: r => r.mcap },
  { key: 'fdv', group: 'Capitalisation', label: 'FDV', end: true, def: false, title: 'Fully diluted valuation in USD.', fmt: r => fmtUsd(r.fdv), val: r => r.fdv },
  { key: 'mcapRank', group: 'Capitalisation', label: 'Rank', end: true, def: false, title: 'Market-cap rank among all coins.', fmt: r => r.mcapRank != null && isFinite(r.mcapRank) ? '#' + r.mcapRank : na(), val: r => r.mcapRank },
  { key: 'volMcap', group: 'Capitalisation', label: 'Vol/Mcap', end: true, def: false, title: 'Volume 24h as a share of market cap: how much of the cap turns over per day.', fmt: r => fmtPct(r.volMcap, 1, false), val: r => r.volMcap },
  { key: 'oiMcap', group: 'Capitalisation', label: 'OI/Mcap', end: true, def: false, title: 'Open interest as a share of market cap: leverage sitting on the coin.', fmt: r => fmtPct(r.oiMcap, 1, false), val: r => r.oiMcap },
  { key: 'oiDP', group: 'Open interest', label: () => `OI Δ ${S.period}`, end: true, def: true, title: 'Change of open interest over the selected period. Read together with price change: up and up is new longs, down and up is a short squeeze.', fmt: r => fmtPct(P(r, 'oiD')), val: r => P(r, 'oiD') },
  { key: 'oiD1d', group: 'Open interest', label: 'OI Δ 1D', end: true, def: true, title: 'Change of open interest over the last 24 hours, independent of the period switch.', fmt: r => fmtPct(r.p['24h'] && r.p['24h'].oiD), val: r => r.p['24h'] && r.p['24h'].oiD },
  { key: 'oiVol', group: 'Open interest', label: 'OI / Vol', end: true, def: false, title: 'Open interest divided by 24h volume. High values mean positions are large against turnover.', fmt: r => fmtX(r.oiVol), val: r => r.oiVol },
  { key: 'funding', group: 'Funding', label: 'Funding', end: true, def: true, title: 'Current funding rate per interval. Positive: longs pay shorts.', fmt: r => fmtFunding(r.funding), val: r => r.funding },
  { key: 'fundingAnn', group: 'Funding', label: 'Funding APR', end: true, def: false, title: 'Current funding rate annualised with the instrument\'s funding interval.', fmt: r => fmtPct(r.fundingAnn, 1), val: r => r.fundingAnn },
  { key: 'fundingNext', group: 'Funding', label: 'Next', end: true, def: false, title: 'Predicted next funding rate.', fmt: r => fmtFunding(r.fundingNext), val: r => r.fundingNext },

  { key: 'rv24', group: 'Volatility', label: 'RV 24h', end: true, def: false, title: 'Realised volatility: standard deviation of the last 24 hourly log returns, annualised.', fmt: r => fmtPct(r.rv24, 0, false), val: r => r.rv24 },

  { key: 'range1d', group: 'Volatility', label: 'Range 1D', end: true, def: false, title: 'Today\'s UTC high minus low as a share of the low.', fmt: r => fmtPct(r.range1d, 1, false), val: r => r.range1d },
  { key: 'toHigh', group: 'Volatility', label: 'To High', end: true, def: false, title: 'Distance from price up to the 30-day high.', fmt: r => fmtPct(r.toHigh, 1, false), val: r => r.toHigh },
  { key: 'toLow', group: 'Volatility', label: 'To Low', end: true, def: false, title: 'Distance from price down to the 30-day low.', fmt: r => fmtPct(r.toLow, 1, false), val: r => r.toLow },
  { key: 'takerP', group: 'Flow', label: () => `Taker buy ${S.period}`, def: true, title: 'Share of taker (market) volume that bought over the selected period, from the trade stream. Fills once the stream has run for the period.', fmt: r => fmtTaker(P(r, 'taker')), val: r => P(r, 'taker') },
  { key: 'deltaP', group: 'Flow', label: () => `Delta ${S.period}`, end: true, def: true, title: 'Taker buy minus taker sell over the period, as a share of period volume. Net aggressive pressure, comparable across instruments.', fmt: r => fmtPct(P(r, 'delta'), 0), val: r => P(r, 'delta') },
  { key: 'tradesP', group: 'Flow', label: () => `Trades ${S.period}`, end: true, def: false, title: 'Taker orders in the period, from the trade stream.', fmt: r => fmtCount(P(r, 'trades')), val: r => P(r, 'trades') },
  { key: 'tape', group: 'Flow', label: 'Tape /min', end: true, def: true, title: 'Taker orders per minute over the last 5 minutes. The Ticks of the reference screener: how fast the tape runs right now.', fmt: r => fmtNum(r.tape, 1), val: r => r.tape },

  { key: 'wo', group: 'Levels', label: 'WO', end: true, def: true, title: 'Distance from price to the open of the current week (Monday 00:00 UTC).', fmt: r => fmtLevel(r.wo), val: r => r.wo && r.wo.dist },
  { key: 'mo', group: 'Levels', label: 'MO', end: true, def: true, title: 'Distance from price to the open of the current month (UTC).', fmt: r => fmtLevel(r.mo), val: r => r.mo && r.mo.dist },

const NUMERIC_COLS = COLS.filter(c => c.val && !c.text);
const CLASS_LABEL = { crypto: 'Crypto', stock: 'Stock', premarket: 'Pre-market', commodity: 'Commodity', other: 'Other' };
// Sector cell: the crypto sector, or the asset class for everything the sector taxonomy does not cover.
function sectorKey(r) { return r.sector || (r.cls && r.cls !== 'crypto' ? CLASS_LABEL[r.cls] || r.cls : null); }
function sectorCounts() { const m = new Map(); for (const r of S.rows.values()) if (r.sector) m.set(r.sector, (m.get(r.sector) || 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1]); }
function sectorCell(r) { const k = sectorKey(r); if (!k) return na(); const cls = r.sector ? '' : ' mid'; return `<span class="sector${cls}" title="${r.name ? r.name.replace(/"/g, '&quot;') : ''}">${k}</span>`; }
const GROUP_ORDER = ['Instrument', 'Price', 'Volume', 'Open interest', 'Funding', 'Volatility', 'Flow', 'Strength vs BTC', 'Levels', 'Order book', 'Listing'];

  if (t.closest('#period') && t.dataset.p && !t.disabled) { S.period = t.dataset.p; store.set('period', S.period); return render(); }
  if (t.dataset.rm != null) { S.filters.splice(+t.dataset.rm, 1); return render(); }
  if (t.dataset.quick) { const [key, op, v] = t.dataset.quick.split('|'); S.filters = S.filters.filter(f => !(f.key === key && f.op === op)); S.filters.push({ key, op, v: op === 'is' ? v : +v }); closePops(); return render(); }
  if (t.dataset.col) { const k = t.dataset.col; if (S.visible.has(k)) S.visible.delete(k); else S.visible.add(k); store.set('cols', [...S.visible]); buildColsPop(); renderHead(); renderBody(); return; }
  if (t.dataset.cols) { S.visible = new Set((t.dataset.cols === 'all' ? COLS : COLS.filter(c => c.def)).map(c => c.key)); store.set('cols', [...S.visible]); buildColsPop(); renderHead(); renderBody(); return; }
  if (t.dataset.star) { e.stopPropagation(); return toggleStar(t.dataset.star); }
  if (t.dataset.menu) { e.stopPropagation(); return toggle($('popRow'), t, () => buildRowPop(t.dataset.menu)); }
  if (t.dataset.act) { const id = $('popRow').dataset.id; closePops(); if (t.dataset.act === 'link' || t.dataset.act === 'trade') { selectRow(id); if (t.dataset.act === 'trade') toast(`Order form opened for ${id}`); } else if (t.dataset.act === 'star') toggleStar(id); else if (t.dataset.act === 'copy') { navigator.clipboard?.writeText(id).then(() => toast('Copied ' + id), () => toast(id)); } else toast('Alerts come in v2'); return; }
  // Header click cycles descending -> ascending -> normal (the preset's own order, no column marked).
  if (t.matches('th') && t.dataset.key) { const c = COLS.find(x => x.key === t.dataset.key); if (!c || !c.val) return; S.sort = S.sort.key !== c.key ? { key: c.key, dir: 'desc' } : S.sort.dir === 'desc' ? { key: c.key, dir: 'asc' } : S.sort.dir === 'asc' ? { key: null, dir: null } : { key: c.key, dir: 'desc' }; return render(); }
  if (t.matches('tr') && t.dataset.id) return selectRow(t.dataset.id);
  if (!t.closest('.pop')) closePops();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'filterForm') { const key = $('fKey').value, op = $('fOp').value, v = parseFilterValue(key, $('fVal').value); if (v == null) { $('fVal').focus(); return; } S.filters.push({ key, op, v }); closePops(); render(); }
  if (e.target.id === 'savePresetForm') { const name = $('presetName').value.trim() || 'My preset'; const id = 'custom-' + Date.now(); S.customPresets.push({ id, label: name, custom: true, filters: S.filters.map(f => ({ ...f })), sort: { ...S.sort }, desc: 'Saved preset' }); store.set('customPresets', S.customPresets); S.preset = id; store.set('preset', id); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePops(); });
$('search').addEventListener('input', e => { S.search = e.target.value; renderBody(); });
$('tableWrap').addEventListener('scroll', e => e.target.classList.toggle('-scrolled', e.target.scrollLeft > 0), { passive: true });
addEventListener('resize', closePops);

/* ========================= Boot ========================= */
async function boot(force) {
  closePops(); clearInterval(S.poll); S.poll = null; if (S.es) { S.es.close(); S.es = null; } S.serverCoverage = null;
  if (S.source === 'demo') return loadDemo();
  if (S.source === 'server') {
    try { return await loadServer(); } catch (e) { console.warn('screener service unreachable, falling back to OKX public', e); }
  }
  try { await loadLive(); } catch (e) { console.warn('OKX unreachable, falling back to demo', e); loadDemo(); $('dataBadgeText').textContent = 'Demo data, OKX unreachable'; }
}

(function init() {
  const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th;
  const p = allPresets().find(x => x.id === S.preset) || PRESETS[0]; S.filters = p.filters.map(f => ({ ...f })); S.sort = { ...p.sort };
  render(); boot();
})();
</script>
